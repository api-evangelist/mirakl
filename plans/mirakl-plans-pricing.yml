summary: >-
  Mirakl publishes public list pricing only for Mirakl Connect, the seller-side
  product (one integration, many channels). The operator-side products — Mirakl
  Marketplace Platform (MMP), Dropship, Catalog Platform (MCP), Platform for
  Services (MPS), Ads and Payout — carry no public price and are sold
  enterprise-direct. API access is not sold as a separate metered plan; it comes
  with the platform subscription, and the throttling contract is per-operation
  call frequency rather than a request quota (see rate-limits/).
