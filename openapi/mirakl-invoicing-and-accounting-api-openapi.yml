        - ROLE_SHOP_ACCOUNTANCY
        - ROLE_PARTNER_TRANSACTION_LOG_READ
      summary: TL03 - Export transaction lines JSON file asynchronously
      tags:
      - Invoicing and Accounting
  /api/sellerpayment/transactions_logs/async/status/{tracking_id}:
    get:
      description: '<div class="extension-title">Description</div>


        Retrieve the status for an TL03 transaction log export.<br/>

        When the export is complete, the URLs to retrieve the files are returned.



        <div class="api-description-extension">

        <div class="extension-title">Call Frequency</div>


        <div class="recommended-call-frequency">Recommended usage: Once per minute until you get an error or a success</div>

        <div class="max-call-frequency">Maximum usage: Every 10 seconds</div>

        </div>'
      operationId: TL04
      parameters:
      - description: The asynchronous transaction log export id
        explode: false
        in: path
        name: tracking_id
        required: true
        schema:
          type: string
        style: simple
      - description: Use this parameter when your user has access to several shops. If not specified, the shop_id from your default shop will be used.
        explode: true
        in: query
        name: shop_id
        required: false
        schema:
          type: integer
          format: int64
        style: form
      responses:
        '200':
          content:
            application/json:
              examples:
                application/json-0:
                  summary: Example with business values (application/json)
                  value:
                    last_updated: '2026-07-20T15:30:38.077Z'
                    status: COMPLETED
                    urls:
                    - http://api.mirakl.net/api/sellerpayment/transactions_logs/export/async/file/8648ca91-f5c0-4815-9bac-7564124d5203?file=0.json
                    - http://api.mirakl.net/api/sellerpayment/transactions_logs/export/async/file/8648ca91-f5c0-4815-9bac-7564124d5203?file=1.json
                application/json-auto:
                  summary: Complete example with value types (application/json)
                  value:
                    error:
                      code: string
                      detail: string
                    last_updated: '2023-03-28T09:34:42Z'
                    status: string
                    urls:
                    - string
              schema:
                type: object
                $ref: '#/components/schemas/TL04_Response_200'
          description: OK
      security:
      - Shop-API-Key:
        - ROLE_SHOP_ACCOUNTANCY
        - ROLE_PARTNER_TRANSACTION_LOG_READ
      summary: TL04 - Poll the status of an asynchronous transaction log export (TL03)
      tags:
      - Invoicing and Accounting
