  /api/document-request/documents/download:
    get:
      description: '<div class="extension-title">Description</div>


        At least one of the following filters must be applied: <code>document_id</code> or <code>entity_id</code><br>If more than one document is requested, the output of the API will be a ZIP archive.<br>The tree structure of this archive is as follows:<pre>

        documents-1624624030618.zip

        |

        |__ product-logistic-order/

        |   |__order1-A/|      |__ INV203837.pdf

        |      |__ INV203837.cxml

        |   |__order1-B/|      |__ INV203839.pdf

        </pre>


        <div class="api-description-extension">

        </div>'
      operationId: DR73
      parameters:
      - description: The document request unique identifier. This parameter can be supplied multiple times.
        explode: true
        in: query
        name: document_request_id
        required: false
        schema:
          type: array
          items:
            type: string
          maxItems: 100
          minItems: 0
        style: form
      - description: Document identifiers. This parameter can be supplied multiple times.
        explode: true
        in: query
        name: document_id
        required: false
        schema:
          type: array
          items:
            type: string
          maxItems: 100
          minItems: 0
        style: form
      - description: Document formats. This parameter can be supplied multiple times.
        explode: true
        in: query
        name: document_format
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - PDF
            - cXML
            maxLength: 100
            minLength: 0
          maxItems: 100
          minItems: 0
        style: form
      - description: 'Entity identifiers related to the documents to download. This parameter can be supplied multiple times.<br>The <code>entity_type</code> must be specified to use this filter, otherwise an error 400 will be returned.<br>Example: entity_id=order1-A&entity_id=order20-A&entity_type=PRODUCT_LOGISTIC_ORDER'
        explode: true
        in: query
        name: entity_id
        required: false
        schema:
          type: array
          items:
            type: string
            maxLength: 100
            minLength: 0
          maxItems: 100
          minItems: 0
        style: form
      - description: Entity types related to the documents to download. This parameter can be supplied multiple times.
        explode: true
        in: query
        name: entity_type
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - PRODUCT_LOGISTIC_ORDER
            - SHOP_BILLING_CYCLE_PURCHASE_ORDER
            - LOGISTIC_PURCHASE_ORDER
            - FEES
            - ONE_OFF_FEES
            maxLength: 100
            minLength: 0
          maxItems: 100
          minItems: 0
        style: form
      responses:
        '200':
          content:
            application/octet-stream:
              examples:
                application/octet-stream-auto:
                  summary: Complete example with value types (application/octet-stream)
                  value: string
              schema:
                type: string
                format: binary
          description: OK
      summary: DR73 - Download accounting documents
      tags:
      - Invoicing and Accounting
  /api/document-request/documents/upload:
    post:
      description: '<div class="extension-title">Description</div>


        Documents filenames must be distinct.<br>If several formats are required for a document request, they must all be uploaded at once.<br><span class=''red''>A maximum of 50 documents can be uploaded simultaneously.</span>


        <div class="api-description-extension">

        </div>'
      operationId: DR74
      parameters: []
      requestBody:
        content:
          multipart/form-data:
            examples:
              multipart/form-data-auto:
                summary: Complete example with value types (multipart/form-data)
                value:
                  documents_input:
                    requests:
                    - document_number: string
                      due_date: '2023-03-28T09:34:42Z'
                      files:
                      - format: PDF
                        name: string
                      issue_date: '2023-03-28T09:34:42Z'
                      request_id: string
                      total_amount_excluding_taxes: 0
                      total_tax_amount: 0
                  files:
                  - string
            schema:
              type: object
              properties:
                documents_input:
                  $ref: '#/components/schemas/DR74_Request_MultipartFormData_DocumentsInput'
                  description: Information about documents to be uploaded
                files:
                  type: array
                  description: The files to be uploaded. Use multipart/form-data with name 'files'. The file names must contain only US-ASCII characters.
                  items:
                    type: string
                    format: binary
              required:
              - documents_input
              - files
      responses:
        '200':
          content:
            application/json:
              examples:
                application/json-0:
                  summary: Example with business values (application/json)
                  value:
                    requests:
                    - errors: []
                      input:
                        document_number: number document
                        due_date: '2022-02-02T00:00:00Z'
                        files:
                        - format: PDF
                          name: file-name.pdf
                        - format: cXML
                          name: file-name.xml
                        issue_date: '2022-01-02T00:00:00Z'
                        request_id: fb057995-ae82-451a-99a6-356adbd86bbb
                    - errors:
                      - code: DATA_NOT_FOUND
                        field: requestId
                        message: 'No document request found for request_id: fb811bad-8c05-4b2e-9975-88de70e4086a'
                      input:
                        document_number: number document 2
                        due_date: '2022-02-01T00:00:00Z'
                        files:
                        - format: PDF
                          name: file-name2.pdf
                        issue_date: '2022-01-01T00:00:00Z'
                        request_id: fb811bad-8c05-4b2e-9975-88de70e4086a
                    - errors:
                      - code: DATA_NOT_FOUND
                        field: requestId
                        message: 'No document request found for request_id: 5a486cb3-64c2-4b94-9b33-fb6342cfe1a8'
                      input:
                        document_number: number document 3
                        due_date: '2022-12-31T00:00:00Z'
                        files:
                        - format: PDF
                          name: invoice.pdf
                        issue_date: '2022-11-24T00:00:00Z'
                        request_id: 5a486cb3-64c2-4b94-9b33-fb6342cfe1a8
                        total_amount_excluding_taxes: 410
                        total_tax_amount: 0
                application/json-auto:
                  summary: Complete example with value types (application/json)
                  value:
                    requests:
                    - errors:
                      - code: string
                        field: string
                        message: string
                      input:
                        document_number: string
                        due_date: '2023-03-28T09:34:42Z'
                        files:
                        - format: PDF
                          name: string
                        issue_date: '2023-03-28T09:34:42Z'
                        request_id: string
                        total_amount_excluding_taxes: 0
                        total_tax_amount: 0
              schema:
                type: object
                $ref: '#/components/schemas/DR74_Response_200'
          description: OK
      summary: DR74 - Upload accounting documents
      tags:
      - Invoicing and Accounting
      x-codeSamples:
      - lang: cURL
        source: "curl -i -X POST \\\n  https://your-instance.mirakl.net/api/document-request/documents/upload \\\n  -H 'Content-Type: multipart/form-data' \\\n  -F 'documents_input=\"{\\\"requests\\\":[{\\\"document_number\\\":\\\"string\\\",\\\"due_date\\\":\\\"2023-03-28T09:34:42Z\\\",\\\"files\\\":[{\\\"format\\\":\\\"PDF\\\",\\\"name\\\":\\\"string\\\"}],\\\"issue_date\\\":\\\"2023-03-28T09:34:42Z\\\",\\\"request_id\\\":\\\"string\\\",\\\"total_amount_excluding_taxes\\\":0,\\\"total_tax_amount\\\":0}]}\";type=application/json' \\\n  -F 'files=@path/to/file'\n"
  /api/invoices:
    get:
      description: '<div class="api-description-extension">

        <div class="extension-title">Call Frequency</div>


        <div class="recommended-call-frequency">Recommended usage: Once per day and as many times as there are invoice pages returned</div>

        <div class="max-call-frequency">Maximum usage: Once per day and as many times as there are invoice pages returned</div>

        <div class="extension-title">Pagination</div>


        <p>This resource supports offset pagination (<a href="#section/Offset-pagination-and-sort">see documentation</a>)</p>


        <div class="extension-title">Sort fields</div>


        <code>sort</code> field can have the following values:<ul><li><b>dateCreated</b> (Default) - Sort by creation date (asc by default)</li></ul>


        </div>'
      operationId: IV01
      parameters:
      - description: Currency code for filtering
        explode: true
        in: query
        name: currency
        required: false
        schema:
          type: string
          enum:
          - AED
          - ARS
          - AUD
          - BAM
          - BGN
          - BHD
          - BRL
          - CAD
          - CHF
