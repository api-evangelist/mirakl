  /api/sellerpayment/transactions_logs/async:
    post:
      description: '<div class="extension-title">Description</div>


        The export is asynchronous. Export status can be retrieved by calling TL04.


        <div class="api-description-extension">

        <div class="extension-title">Call Frequency</div>


        <div class="recommended-call-frequency">Recommended usage: <br/> once per day</div>

        <div class="max-call-frequency">Maximum usage: <br/> once per day</div>

        </div>'
      operationId: TL03
      parameters:
      - description: Use this parameter when your user has access to several shops. If not specified, the shop_id from your default shop will be used.
        explode: true
        in: query
        name: shop_id
        required: false
        schema:
          type: integer
          format: int64
        style: form
      requestBody:
        content:
          application/json:
            examples:
              application/json-0:
                summary: Example with business values (application/json)
                value:
                  Transaction_date_from: '2021-11-12T02:34:00Z'
                  megabytes_per_chunk: '10'
                  shop_domain:
                  - PRODUCT
                  transaction_type:
                  - MANUAL_CREDIT
              application/json-auto:
                summary: Complete example with value types (application/json)
                value:
                  accounting_document_id: string
                  accounting_document_number: string
                  date_created_from: '2023-03-28T09:34:42Z'
                  date_created_to: '2023-03-28T09:34:42Z'
                  format: JSON
                  items_per_chunk: 0
                  last_updated_from: '2023-03-28T09:34:42Z'
                  megabytes_per_chunk: 0
                  order_id:
                  - string
                  order_line_id:
                  - string
                  order_reference_for_customer:
                  - string
                  order_reference_for_seller:
                  - string
                  other_reference:
                  - string
                  pay_out_psp_codes:
                  - NOT_SPECIFIED
                  payment_state:
                  - PENDING
                  payment_voucher_number: string
                  seller_billing_cycle_id:
                  - string
                  shop_domain:
                  - string
                  shop_id: 0
                  shop_model:
                  - MARKETPLACE
                  transaction_date_from: '2023-03-28T09:34:42Z'
                  transaction_date_to: '2023-03-28T09:34:42Z'
                  transaction_type:
                  - MANUAL_CREDIT
            schema:
              $ref: '#/components/schemas/TL03_Request'
      responses:
        '200':
          content:
            application/json:
              examples:
                application/json-0:
                  summary: Example with business values (application/json)
                  value:
                    tracking_id: 4e06db23-d163-4510-aa57-618e17cbce96
                application/json-auto:
                  summary: Complete example with value types (application/json)
                  value:
                    tracking_id: string
              schema:
                type: object
                $ref: '#/components/schemas/TL03_Response_200'
          description: OK
      security:
