components:
  schemas:
    TaxPayload:
      description: Tax payload
      properties:
        amount:
          $ref: '#/components/schemas/PricePayload'
          description: Canceled tax amount
        code:
          type: string
          description: Tax code on the sales channel
      required:
      - amount
      - code
    UploadOrderDocumentEntityEvent:
      properties:
        id:
          type: string
          description: Identifier of the entity to which the order document is linked.
        type:
          type: string
          description: 'Type of the entity to which the order document is linked.


            Enum: `"RETURN"`

            '
      required:
      - id
      - type
    ReturnAcceptanceCommandEvent:
      description: Return Acceptance payload command, used to process return acceptance or refusal
      properties:
        accepted:
          type: boolean
          description: Indicates if a return is accepted (true) or refused (false).
        action_id:
          type: string
          description: A unique identifier for the order action request. Will be used by the connector to update the order action status. see updateActionStatus
        channel_id:
          type: string
          description: The channel id
