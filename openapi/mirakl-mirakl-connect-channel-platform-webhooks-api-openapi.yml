  OfferUpsertEvent:
    post:
      description: The offer upsert event received by third parties
      operationId: OfferUpsertEvent
      requestBody:
        content:
          application/json:
            examples:
              application/json-0:
                summary: Offer Creation Example
                value:
                  data:
                    channel_id: '001'
                    discount_price:
                      action_type: UPDATE
                      end_date: '2024-06-20T10:15:30.500Z'
                      price:
                        amount: 24.99
                        currency: EUR
                      start_date: '2024-05-20T10:15:30.500Z'
                    identifier:
                      type: GTIN
                      value: '1234567890123'
                    identifiers:
                    - type: GTIN
                      value: '1234567890123'
                    inventory:
                      action_type: UPDATE
                      delivery_partner:
                        name: __self__
                      quantity: 500
                    offer_attributes:
                    - id: label
                      type: TEXT
                      value: My first SKU
                    - id: warranty
                      type: NUMERIC
                      value: 12
                    - id: color
                      type: LIST
                      values:
                      - value: red
                      - value: blue
                    product_id: SKU_123456
                    standard_price:
                      action_type: UPDATE
                      price:
                        amount: 29.99
                        currency: EUR
                    stock:
                      action_type: UPDATE
                      breakdown:
                      - quantity: 300
                        type: SELLER_WAREHOUSE
