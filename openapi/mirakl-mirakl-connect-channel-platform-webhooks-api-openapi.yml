                          id: WH_PARIS
                      - quantity: 200
                        type: SELLER_WAREHOUSE
                        warehouse:
                          id: WH_LYON
                    store_id: '2005'
                    use_case: OFFER_CREATION
                  id: 01jt31mw7wy3x4zs55kawgg1xe
                  time: '2024-05-20T10:15:30.500Z'
                  type: OFFER_UPSERT
