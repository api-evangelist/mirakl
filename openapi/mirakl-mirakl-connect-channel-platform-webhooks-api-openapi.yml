      - $ref: '#/components/schemas/OrderAcceptanceCommandEvent'
      - $ref: '#/components/schemas/OrderShipmentCommandEvent'
      - $ref: '#/components/schemas/ReturnAcceptanceCommandEvent'
      - $ref: '#/components/schemas/ReturnTrackingInformationUpdateCommandEvent'
      - $ref: '#/components/schemas/AcknowledgeReturnReceptionCommandEvent'
      - $ref: '#/components/schemas/CloseReturnCommandEvent'
      - $ref: '#/components/schemas/DocumentUploadCommandEvent'
    OrderLineCancelationPayload:
