  OrderActionEvent:
    post:
      description: Command to perform an action on an order. This event is processed by the channel technology connector
      operationId: OrderActionEvent
      requestBody:
        content:
          application/json:
            examples:
              application/json-0:
                summary: Refund order example
                value:
                  data:
                    action_id: refund-action-123
                    channel_id: marketplace_channel
                    channel_order_id: ORDER-12345
                    channel_store_id: main_store
                    refunds:
                    - order_line_id: 0002_3202630-A-1
                      price:
                        amount: 15
                        currency: USD
                      product_id: '10000'
                      quantity: 1
                      reason: ITEM_NOT_RECEIVED
                      shipping_price:
                        amount: 8
                        currency: USD
                      shipping_taxes:
                      - amount:
                          amount: 3
                          currency: USD
                        code: ShippingTax1
                      - amount:
                          amount: 4
                          currency: USD
                        code: ShippingTax2
                      taxes:
                      - amount:
                          amount: 1
                          currency: USD
                        code: Tax1
                      - amount:
                          amount: 2
                          currency: USD
                        code: Tax2
                    sub_channel_code: FR
                  id: 01HGXNJ6VTZR5KJBBQT28YZ2PB
                  time: '2024-05-20T10:15:30.500Z'
                  type: REFUND
              application/json-1:
                summary: Cancel order example
                value:
                  data:
                    action_id: cancel-action-123
                    cancelations:
                    - channel_order_line_id: 0002_3202630-A-1
                      price:
                        amount: 15
                        currency: USD
                      product_id: '10000'
                      quantity: 1
                      reason: CUSTOMER_CANCELATION
                      shipping_price:
                        amount: 8
                        currency: USD
                      shipping_taxes:
                      - amount:
                          amount: 3
                          currency: USD
                        code: ShippingTax1
                      - amount:
                          amount: 4
                          currency: USD
                        code: ShippingTax2
                      taxes:
                      - amount:
                          amount: 1
                          currency: USD
                        code: Tax1
                      - amount:
                          amount: 2
                          currency: USD
                        code: Tax2
                    channel_id: marketplace_channel
                    channel_order_id: ORDER-12345
                    channel_store_id: main_store
                    sub_channel_code: FR
                  id: 01HGXNJ6VTZR5KJBBQT28YZ2PA
                  time: '2024-05-20T10:15:30.500Z'
                  type: CANCEL
              application/json-2:
                summary: Accept order example
                value:
                  data:
                    action_id: accept-action-123
                    channel_id: marketplace_channel
                    channel_order_id: ORDER-12345
                    channel_store_id: main_store
                    order_lines:
                    - accepted: true
                      channel_order_line_id: 0002_3202630-A-1
                    - accepted: false
                      channel_order_line_id: 0002_3202630-A-2
                    sub_channel_code: FR
                  id: 01HGXNJ6VTZR5KJBBQT28YZ2PC
                  time: '2024-05-20T10:15:30.500Z'
                  type: ACCEPT
              application/json-3:
                summary: Create shipment example
                value:
                  data:
                    action_id: shipment-action-123
                    carrier: UPS
                    channel_id: marketplace_channel
                    channel_order_id: ORDER-12345
                    channel_store_id: main_store
                    items:
                    - channel_order_line_id: 0024_COMMERCIAL_ID-A-1
                      id: SELLER_ID_1
                      quantity: 10
                    sub_channel_code: FR
                    tracking_number: '123456'
                    tracking_url: https://wwwapps.ups.com/WebTracking/track
                    warehouse_id: WH-001
