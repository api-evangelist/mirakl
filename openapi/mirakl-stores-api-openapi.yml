  /api/account/statistics:
    get:
      description: '<div class="api-description-extension">

        <div class="extension-title">Call Frequency</div>


        <div class="recommended-call-frequency">Recommended usage: Once per day</div>

        <div class="max-call-frequency">Maximum usage: Once per day</div>

        </div>'
      operationId: A21
      parameters:
      - description: List of periods using a comma (,) as a separator. Accepted values are <code>ALL_SINCE_BEGINNING</code>, <code>LAST_MONTH</code>, <code>LAST_THREE_MONTHS</code>, <code>LAST_SIX_MONTHS</code>, <code>LAST_YEAR</code>. If specified, only statistics for the given periods will be returned. If not, all statistics will be returned.
        explode: true
        in: query
        name: periods
        required: false
        schema:
          type: string
        style: form
      - description: The code of the channel to filter statistics on. If not specified, the overall statistics will be returned.
        explode: true
        in: query
        name: channel_code
        required: false
        schema:
          type: string
        style: form
      - description: Use this parameter when your user has access to several shops. If not specified, the shop_id from your default shop will be used.
        explode: true
        in: query
        name: shop_id
        required: false
        schema:
          type: integer
          format: int64
        style: form
      responses:
        '200':
          content:
            application/json:
              examples:
                application/json-auto:
                  summary: Complete example with value types (application/json)
                  value:
                    approval_delay:
                    - period: ALL_SINCE_BEGINNING
                      value: 0
                    approval_rate:
                    - period: ALL_SINCE_BEGINNING
                      value: 0
                    auto_refused_rate:
                    - period: ALL_SINCE_BEGINNING
                      value: 0
                    average_cart:
                    - period: ALL_SINCE_BEGINNING
                      value: 0
                    average_cart_with_shipping:
                    - period: ALL_SINCE_BEGINNING
                      value: 0
                    cancelation_rate:
                    - period: ALL_SINCE_BEGINNING
                      value: 0
                    channel: string
                    consecutive_refused_orders_count:
                    - period: ALL_SINCE_BEGINNING
                      value: 0
                    evaluations_count:
                    - period: ALL_SINCE_BEGINNING
                      value: 0
                    grade:
                    - period: ALL_SINCE_BEGINNING
                      value: 0
                    incident_rate:
                    - period: ALL_SINCE_BEGINNING
                      value: 0
                    last_updated_date: '2023-03-28T09:34:42Z'
                    late_shipment_rate:
                    - period: ALL_SINCE_BEGINNING
                      value: 0
                    offers_count:
                    - period: ALL_SINCE_BEGINNING
                      value: 0
                    order_messages_response_delay:
                    - period: ALL_SINCE_BEGINNING
                      value: 0
                    orders_count:
                    - period: ALL_SINCE_BEGINNING
                      value: 0
                    refund_rate:
                    - period: ALL_SINCE_BEGINNING
