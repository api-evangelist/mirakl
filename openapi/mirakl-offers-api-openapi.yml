        explode: true
        in: query
        name: origins
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - API
            - FTP
            - SFTP
            - HTTP
            - HTTPS
            - FRONT
            - PENDING_OFFERS
        style: form
      responses:
        '200':
          content:
            application/json:
              examples:
                application/json-auto:
                  summary: Complete example with value types (application/json)
                  value:
