components:
  schemas:
    OF22_Response_200_AllPrices_Context:
      type: object
      properties:
        channel_codes:
          type: array
          description: The channel codes on which a specific price applies.
          items:
            type: string
        customer_group_ids:
          type: array
          description: The customer group ids on which a specific price applies.
          items:
            type: string
        customer_organization_ids:
          type: array
          description: The customer organization ids on which a specific price applies.
          items:
            type: string
        end_date:
          type: string
          format: date-time
          description: The end date of a specific price.
        start_date:
          type: string
          format: date-time
          description: The start date of a specific price.
    OF54_Response_200_Ext_FileStructure_RetailPrices:
      type: object
      properties:
        discount_end_date:
          type: string
          description: End date of the discounted retail price
        discount_price:
          type: number
          format: with decimals
          description: Discounted retail price
        discount_start_date:
          type: string
          description: Start date of the discounted retail price
        origin_price:
          type: number
          format: with decimals
          description: Retail price without discount
    OF24_Request_Offers_Discount:
      type: object
      description: 'Discount of an offer. Offer update: if not provided, existing data will be deleted.'
      properties:
        end_date:
          type: string
          description: 'Discount end date. May be required when a discount price is set, check platform configuration. Offer update: if not provided, existing data will be deleted.'
        price:
          type: number
          format: with decimals
          description: 'Discount price. Not to be used when ranges are specified. Offer update: if not provided, existing data will be deleted. For Dropship specifically: the discount purchasing price of the offer, also referred to as discount cost or discount wholesale price.'
        ranges:
          type: array
          description: 'Discount ranges. Offer update: if not provided, existing data will be deleted.'
          items:
            $ref: '#/components/schemas/OF24_Request_Offers_Discount_Ranges'
        start_date:
          type: string
          description: 'Discount start date. May be required when a discount price is set, check platform configuration. Offer update: if not provided, existing data will be deleted.'
    OF24_Request:
      type: object
      properties:
        offers:
          type: array
          description: Offers list
          items:
            $ref: '#/components/schemas/OF24_Request_Offers'
      required:
      - offers
    OF21_Response_200_Offers_EcoContributions:
      type: object
      properties:
        eco_contribution_amount:
          type: number
          format: with decimals
          description: Amount of the eco-contribution.
        epr_category_code:
          type: string
          description: 'Extended Producer Responsibility (EPR) category code.


            Enum: `"FR-AGROPACK"`, `"FR-ASL"`, `"FR-DASRIPAT"`, `"FR-DBPS"`, `"FR-DDS"`, `"FR-DEA"`, `"FR-DEEE"`, `"FR-DISPMED"`, `"FR-DIY"`, `"FR-EMBM"`, `"FR-GF"`, `"FR-JOUETS"`, `"FR-LUB"`, `"FR-MH"`, `"FR-MNU"`, `"FR-PA"`, `"FR-PAP"`, `"FR-PCHIM"`, `"FR-PMCB"`, `"FR-PNEU"`, `"FR-TABAC"`, `"FR-TLC"`, `"FR-VEHICULE"`, `"FR-VHU"`, `"DE-BATTG"`, `"DE-PACK"`, `"DE-WEEE"`, `"ES-PACK"`, `"ES-GPACK"`, `"ES-WEEE"`

            '
          maxLength: 255
          minLength: 0
        producer_id:
          type: string
          description: Producer identifier of the eco-contribution.<br/>Not present if the producer identifier belongs to the operator.
          maxLength: 255
          minLength: 0
      required:
      - epr_category_code
    OF21_Response_200_Offers_ApplicablePricing_Context:
      type: object
      properties:
        channel_codes:
          type: array
          description: The channel codes on which a specific price applies.
          items:
            type: string
        customer_group_ids:
          type: array
          description: The customer group ids on which a specific price applies.
          items:
            type: string
        customer_organization_ids:
          type: array
          description: The customer organization ids on which a specific price applies.
          items:
            type: string
        end_date:
          type: string
          format: date-time
          description: The end date of a specific price.
        start_date:
          type: string
          format: date-time
          description: The start date of a specific price.
    OF22_Response_200_ApplicablePricing:
      type: object
      properties:
        channel_code:
          type: string
          deprecated: true
          description: "    Single Channel Pricing users: The channel code on which a specific price applies.\n    This is the pricing_channel_code supplied as input in the API if prices are defined for this channel.\n    If no pricing is defined for this channel, or no pricing_channel_code is supplied, it falls back on the default prices.\n    channel_code is set to null for the default prices. Multi Channel Pricing users: returned null.\n    Refer to context > channel_codes in order to retrieve the channel codes for which the price apply.\n"
        context:
          $ref: '#/components/schemas/OF22_Response_200_ApplicablePricing_Context'
          description: 'The context is not returned for default prices.

            '
        discount_end_date:
          type: string
          format: date-time
          description: End date of the discount, or null if no discount exists or if the discount does not have an end date.
        discount_start_date:
          type: string
          format: date-time
          description: Start date of the discount, or null if no discount exists or if the discount does not have a start date.
        price:
          type: number
          format: with decimals
          description: 'Price of the offer.

            <br/>

            For Dropship specifically: the purchasing price of the offer

            <br/>

            If a discount is defined and is currently active (within the validity interval), it represents the unit_discount_price.

            <br/>

            In other cases, it represents the unit_origin_price.

            '
        unit_discount_price:
          type: number
          format: with decimals
          description: 'Discount price for a quantity of one, i.e. the discount price for a quantity of one.

            <br/>

            For Dropship specifically: the discount purchasing price for a quantity of one

            <br/>

            Set to null if no discount is defined or if no discount price for a quantity of one is defined.

            '
        unit_origin_price:
          type: number
          format: with decimals
          description: 'Original price for a quantity of one, i.e. the price for a quantity of one regardless of the discounts.

            <br/>

            For Dropship specifically: the purchasing price for a quantity of one, also referred to as cost or wholesale price

            '
        volume_prices:
          type: array
          description: 'Volume prices for each quantity threshold. Returns at least the price for a quantity threshold of one.

            '
          items:
            $ref: '#/components/schemas/OF22_Response_200_ApplicablePricing_VolumePrices'
      required:
      - price
      - unit_origin_price
      - volume_prices
    OF54_Response_200_Ext_FileStructure_Fulfillment_Center:
      type: object
      properties:
        code:
          type: string
          description: Code of the fullfilment center
    OF26_Response_200:
      type: object
      properties:
        offer_id:
          type: integer
          format: int64
          description: Offer identifier
        quantity:
          type: integer
          format: int32
          description: 'Get the quantity of stock available for this offer.<br/>Quantity return rules:<br/><ul><li> 0: if quantity = 0 or the offer is not available</li><li> x: quantity available</li></ul>'
      required:
      - offer_id
      - quantity
    OF24_Request_Offers_Discount_Ranges:
      type: object
      description: 'Discount ranges. Offer update: if not provided, existing data will be deleted.'
      properties:
        price:
          type: number
          format: with decimals
          description: Price of the offer if the quantity threshold is reached
        quantity_threshold:
          type: integer
          format: int32
          description: Minimum quantity to order for the given price to be applied
      required:
      - price
      - quantity_threshold
    OF22_Response_200_RetailPrices:
      type: object
      properties:
        discount_end_date:
          type: string
          format: date-time
          description: End date of the discount, or null if no discount exists or if the discount does not have an end date.
        discount_start_date:
          type: string
          format: date-time
          description: Start date of the discount, or null if no discount exists or if the discount does not have a start date.
        price:
          type: number
          format: with decimals
          description: 'Retail price of the offer, also referred to as selling price.

            <br/>

            If a discount is defined and is currently active (within the validity interval), it represents the unit_discount_price.

            <br/>

            In other cases, it represents the unit_origin_price.

            '
        unit_discount_price:
          type: number
          format: with decimals
          description: 'Discount retail price for a quantity of one, i.e. the discount retail price for a quantity of one.

            <br/>

            Set to null if no discount is defined or if no discount retail price for a quantity of one is defined or if the discount is not currently active (within the validity interval).

            '
        unit_origin_price:
          type: number
          format: with decimals
          description: Original retail price for a quantity of one, i.e. the retail price for a quantity of one regardless of the discounts.
      required:
      - price
      - unit_origin_price
    OF54_Response_200_Ext_FileStructure_ShippingTypes:
      type: object
      properties:
        code:
          type: string
          description: Shipping method code
        delivery_time:
          $ref: '#/components/schemas/OF54_Response_200_Ext_FileStructure_ShippingTypes_DeliveryTime'
          description: Expected order delivery time
        shipping_price_additional_unit:
          type: number
          format: with decimals
          description: Additional shipping price of the offer
        shipping_price_type:
          type: string
          description: Shipping price type of the offer
        shipping_price_unit:
          type: number
          format: with decimals
          description: Shipping price of the offer
        shipping_zone_code:
          type: string
          description: Shipping zone code
    OF54_Response_200_Ext_FileStructure_ShippingTypes_DeliveryTime:
      type: object
      properties:
