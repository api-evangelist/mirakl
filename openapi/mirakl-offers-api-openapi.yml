      - description: Shop identifier
        explode: true
        in: query
        name: shop_id
        required: false
        schema:
          type: integer
          format: int64
        style: form
      - description: Start creation date for filtering
        explode: true
        in: query
        name: start_date
        required: false
        schema:
          type: string
          format: date-time
        style: form
      - description: End creation date for filtering
        explode: true
        in: query
        name: end_date
        required: false
        schema:
          type: string
          format: date-time
        style: form
      - description: Offer import status
        explode: true
        in: query
        name: status
        required: false
        schema:
          type: string
          enum:
          - WAITING
          - RUNNING
          - COMPLETE
          - FAILED
        style: form
