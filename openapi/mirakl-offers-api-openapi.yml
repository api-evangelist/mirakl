                  file: 'offer-sku;price-type;price;discount-price;discount-start-date;discount-end-date

                    SKU001;PRICE;20;;;

                    SKU001;RETAIL-PRICE;25;;;

                    SKU002;PRICE;30;28;2024-12-31T00:00:00Z;2025-12-31T00:00:00Z

                    SKU002;RETAIL-PRICE;35;32;2024-12-31T00:00:00Z;2025-12-31T00:00:00Z

