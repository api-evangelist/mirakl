                      has_error_report: true
                      import_id: string
                      lines_in_error: 0
                      lines_in_success: 0
                      offers_in_error: 0
                      offers_updated: 0
                      origin: API
                      reason_status: string
                      shop_id: 0
                      status: WAITING
                    next_page_token: string
                    previous_page_token: string
              schema:
                type: object
                $ref: '#/components/schemas/PRI02_Response_200'
          description: OK
      security:
      - Operator-Bearer-Token: []
      - OAuth-2: []
      summary: PRI02 - Get information and statistics about an offer pricing import
      tags:
      - Offers
  /api/offers/pricing/imports/{import_id}/error_report:
    get:
      description: '<div class="extension-title">Description</div>


        Only returns lines of offers with at least one offer price in error.<br/>

        The first column contains the line number in error. The second column contains the error reason.<br/>

