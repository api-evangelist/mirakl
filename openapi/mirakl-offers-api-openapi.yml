  /api/offers/pricing/imports:
    post:
      description: '<div class="extension-title">Description</div>


        Import a .csv file to submit all applicable prices for an offer.<br/>

        The import mode is delete and replace: any existing price that is not submitted will be deleted.<br/>

        If Price Approval is enabled, this API creates and updates pending prices; ongoing prices will remain.<br/>

        Returns an import identifier to track the status of the import and retrieve an error report if applicable.<br/>



        <div class="api-description-extension">

        <div class="extension-title">Call Frequency</div>


        <div class="recommended-call-frequency">Recommended usage: Every 5 minutes</div>

        <div class="max-call-frequency">Maximum usage: Once per minute</div>

        <div class="extension-title">Read More</div>


        <ul><li><a href="https://help.mirakl.com/bundle/customers/page/topics/Mirakl/integration_guide/adv_pricing_inte/import_prices.htm">Importing prices</a></li><li><a href="https://help.mirakl.com/bundle/customers/page/topics/Mirakl/integration_guide/adv_pricing_inte/price_file.htm">About the price file format</a></li></ul></div>'
      operationId: PRI01
      parameters: []
      requestBody:
        content:
          multipart/form-data:
            examples:
              multipart/form-data-0:
                summary: Non Advanced Pricing users
                value:
                  file: 'offer-sku;price;price-ranges;discount-price;discount-ranges;discount-start-date;discount-end-date

                    SKU001;20;1|20,10|15;18;1|18,10|12;2024-01-01T23:00:00Z;2024-06-30T23:00:00Z

                    '
                  shop: 0
              multipart/form-data-1:
                summary: Channel Pricing
                value:
                  file: 'offer-sku;price;price-ranges;discount-price;discount-ranges;channels;discount-start-date;discount-end-date

                    SKU001;20;1|20,10|15;18;1|18,10|12;;2024-01-01T23:00:00Z;2024-06-30T23:00:00Z

                    SKU001;30;1|30,10|20;25;1|25,10|15;US|CA;2024-01-01T23:00:00Z;

                    SKU001;22;;16;;FR;;

                    '
                  shop: 0
