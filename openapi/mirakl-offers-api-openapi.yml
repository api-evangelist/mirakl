                summary: Scheduled Pricing
                value:
                  file: 'offer-sku;price;price-ranges;discount-price;discount-ranges;start-date;end-date;discount-start-date;discount-end-date

                    SKU001;20;1|20,10|15;;;;;;

                    SKU001;20;1|20,10|15;18;1|18,10|12;2024-01-01T23:00:00Z;2024-03-30T23:00:00Z;;

                    SKU001;15;;10;;2024-04-01T23:00:00Z;2024-06-30T23:00:00Z;2024-05-01T23:00:00Z;2024-05-30T23:00:00Z

