  /api/products/offers:
    get:
      description: '<div class="extension-title">Description</div>


        List offers for each given product


        <div class="alert alert-info" role="alert">

        By default, users calling this API with a Seller API key can retrieve both their own offers and some of their competitors’ data. If you want to prevent them from accessing competitors’ data, please contact the Mirakl Support Team.

        </div>



        <div class="api-description-extension">

        <div class="extension-title">Call Frequency</div>


        <div class="recommended-call-frequency">Recommended usage: At each product page display</div>

        <div class="max-call-frequency">Maximum usage: At each product page display</div>

        <div class="extension-title">Read More</div>


        <ul><li><a href="https://help.mirakl.com/bundle/customers/page/topics/Mirakl/integrating_mirakl/display_different_prices_per_channel.html">More context (Displaying different prices per channel)</a></li><li><a href="https://help.mirakl.com/bundle/customers/page/topics/Mirakl/integrating_mirakl/integrate_quotes/listing_offers_eligible_quotes.html">More context (Listing offers eligible for quotes)</a></li><li><a href="https://help.mirakl.com/bundle/customers/page/topics/Mirakl/integrating_mirakl/integrate_price_approval.htm">If the "Price approval" option is activated, read this page</a></li><li><a href="https://help.mirakl.com/bundle/customers/page/topics/Mirakl/integration_guide/adv_pricing_inte/adv_pricing_offer_apis.htm#Aboutprioritizationrulesforpricefields">Price prioritization for Advanced Pricing</a></li><li><a href="https://help.mirakl.com/bundle/customers/page/topics/Mirakl/integration_guide/adv_pricing_inte/adv_pricing_offer_apis.htm#AboutpricesinAPIP11">Advanced Pricing in P11</a></li></ul><div class="extension-title">Pagination</div>


        <p>This resource supports offset pagination (<a href="#section/Offset-pagination-and-sort">see documentation</a>)</p>


        <div class="extension-title">Sort fields</div>


        <code>sort</code> field can have the following values:<ul><li><b>bestPrice</b> (Default) - Sorts by product sku and then by total price, premium information, shop grade (asc by default)</li><li><b>bestEvaluation</b> - Sorts by product sku and then by shop grade, total price, premium information (asc by default)</li></ul>


        <div class="extension-title">Localization</div>


        <p>This resource supports <code>locale</code> parameter (<a href="#section/Locale">see documentation</a>)</p><p>Localized output fields will be highlighted with an icon: <span class="flag"></span></p></div>'
      operationId: P11
      parameters:
      - description: 'List of product''s skus separated with comma. Limited to 100 values.


          One of the two is required `product_ids` or `product_references`.

          '
        explode: true
        in: query
        name: product_ids
        required: false
        schema:
          type: string
        style: form
      - description: 'List of the product''s identifiers with type _(structure: "`product_references=<productIdType>|<productId>,<productIdType>|<productId>, ...`")_.<br/>

          Limited to 100 values.  One of the two is required product_ids or product_references.


          Example: /api/products/offers?product_references=EAN|3120201243238

          '
        explode: true
        in: query
        name: product_references
        required: false
        schema:
          type: string
        style: form
      - description: List of offer state codes
        explode: true
        in: query
        name: offer_state_codes
        required: false
        schema:
          type: string
        style: form
      - description: 'If `true`, returns only offers of premium shops.<br/>

          If `false`, returns only offers of shops that are not premium.

          '
        explode: true
        in: query
        name: premium
        required: false
        schema:
          type: string
          default: ALL
          enum:
          - 'TRUE'
          - 'FALSE'
          - ALL
        style: form
      - description: If <code>false</code> returns only active offers. If <code>true</code> return all offers.
        explode: true
        in: query
        name: all_offers
        required: false
        schema:
          type: boolean
          default: false
        style: form
      - description: List of the channel codes to filter with, using a comma (,) as a separator. If specified, only offers that can be sold on the specified channel(s) will be returned. If not, offers will be returned regardless of their channels.
        explode: true
        in: query
        name: channel_codes
        required: false
        schema:
          type: string
        style: form
      - description: 'If `false`, filters the offers with the given `channel_codes` or the default channel if no `channel_codes` are given.<br/>

          If `true`, does not filter the offers on channels and ignore the `channel_codes`.

          '
        explode: true
        in: query
        name: all_channels
        required: false
        schema:
          type: boolean
          default: false
        style: form
      - description: Filter used to pick prices on a specific channel
        explode: true
        in: query
        name: pricing_channel_code
        required: false
        schema:
          type: string
        style: form
      - description: For Customer Pricing users only. Customer identifier code the API will use to return all prices and applicable price for this organization. Ignored if value does not exist.
        explode: true
        in: query
        name: pricing_customer_organization_id
        required: false
        schema:
          type: string
        style: form
      - description: 'List of shop IDs separated with comma. Limited to 100 values.


          Filter used to return only the offers of the listed shops.

          '
        explode: true
        in: query
        name: shop_ids
        required: false
        schema:
          type: string
        style: form
      - description: List of shipping zones. Filter used to pick shipping prices on one or multiple shipping zones
        explode: true
        in: query
        name: shipping_zones
        required: false
        schema:
          type: string
        style: form
      - description: 'If `false`, filters the offers with the given shipping zones.<br/>

          If `true`, selects all shop shipping zones and ignores the provided `shipping_zones`.

          '
        explode: true
        in: query
        name: all_shipping_zones
        required: false
        schema:
          type: boolean
          default: false
        style: form
      - description: 'A comma separated list of platform models to filter with.<br/>

          Accepted values are `MARKETPLACE`, `DROPSHIP`, `ONE_CREDITOR`

          '
        explode: true
        in: query
        name: models
        required: false
        schema:
          type: string
        style: form
      responses:
        '200':
          content:
            application/json:
              examples:
                application/json-0:
                  summary: Example with business values for single channel pricing users (application/json)
                  value:
                    products:
