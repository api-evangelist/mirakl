              schema:
                type: object
                $ref: '#/components/schemas/OF04_Response_200'
          description: OK
      security:
      - Operator-Bearer-Token: []
      - OAuth-2: []
      summary: OF04 - Get information and statistics about offer imports
      tags:
      - Offers
