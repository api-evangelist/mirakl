                      quantity: 0
                      can_cancel: true
                      can_refund: true
                      total_shipping_price:
                        amount: 0
                        currency: string
                      price:
                        amount: 0
                        currency: string
                      product:
                        id: string
                        title: string
                        thumbnail_url: string
                      taxes:
                      - amount:
                          amount: 0
                          currency: string
                        code: string
                        rate: 0
                        seller_collectible:
                          amount: 0
                          currency: string
                        channel_collectible:
                          amount: 0
                          currency: string
                      shipping_taxes:
                      - amount:
                          amount: 0
                          currency: string
                        code: string
                        rate: 0
                        seller_collectible:
                          amount: 0
                          currency: string
                        channel_collectible:
                          amount: 0
                          currency: string
                      status: AWAITING_ACCEPTANCE
                      status_reason: ACCEPTANCE_TIMEOUT
                      adjustments:
                      - channel_adjustment_id: string
                        reason: CUSTOMER_CANCELATION
                        created_at: '2023-03-28T09:34:42Z'
                        type: REFUND
                        quantity: 0
                        price:
                          amount: 0
                          currency: string
                        taxes:
                        - amount:
                            amount: 0
                            currency: string
                          code: string
                          rate: 0
                          seller_collectible:
                            amount: 0
                            currency: string
                          channel_collectible:
                            amount: 0
                            currency: string
                        shipping_price:
                          amount: 0
                          currency: string
                        shipping_taxes:
                        - amount:
                            amount: 0
                            currency: string
                          code: string
                          rate: 0
                          seller_collectible:
                            amount: 0
                            currency: string
                          channel_collectible:
                            amount: 0
                            currency: string
                      custom_attributes:
