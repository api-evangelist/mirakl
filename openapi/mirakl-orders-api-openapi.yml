  /api/orders/shipping_from:
    put:
      description: '<div class="extension-title">Description</div>


        <p>Update shipping origin (<code>shipping_from</code>) information on order lines.</p> <p><span class=''red''>A maximum of 100 order lines can be sent at once.</span></p>


        <div class="api-description-extension">

        <div class="extension-title">Call Frequency</div>


        <div class="recommended-call-frequency">Recommended usage: At each update of shipping origin on one or multiple order lines</div>

        <div class="max-call-frequency">Maximum usage: 60 per hour, 100 order lines per call</div>

