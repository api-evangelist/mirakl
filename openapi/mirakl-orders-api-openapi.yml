  /api/orders/{order_id}/accept:
    put:
      description: '<div class="extension-title">Description</div>


        Accept or refuse order lines in the <code>WAITING_ACCEPTANCE</code> status


        <details>

        <summary>Error Codes</summary>


        | Code | Description |

        |------|-------------|

        | <code>ORDER_FULFILLED_UNAUTHORIZED</code> | An unauthorized action has been requested on a fulfilled order |

        | <code>ORDER_INVALID_STATE</code> | Order is not in the expected state for this operation |

        | <code>ORDER_LINE_ACCEPTANCE_DECISION_MISSING</code> | Some order lines are missing from the acceptance decision |

        | <code>ORDER_LINE_DUPLICATE_ID</code> | The order lines list contains duplicate order line IDs |

        | <code>ORDER_LINE_NOT_FOUND</code> | The requested order line does not exist or is not associated with the order |

        | <code>ORDER_LINE_NULL_ELEMENT</code> | The order lines list contains a null element |

        | <code>ORDER_NOT_FOUND</code> | The requested order does not exist |

        | <code>ORDER_PARTIAL_ACCEPTANCE_DISABLED</code> | Partial acceptance is disabled for this shop |

        | <code>VALIDATION_ERROR</code> | Input validation failed |


        </details>



        <div class="api-description-extension">

        <div class="extension-title">Call Frequency</div>


        <div class="recommended-call-frequency">Recommended usage: At each new order on the Marketplace</div>

        <div class="max-call-frequency">Maximum usage: At each new order on the Marketplace</div>

        </div>'
      operationId: OR21
      parameters:
      - description: Order's identifier
        explode: false
        in: path
        name: order_id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            examples:
              application/json-0:
                summary: Example with business values (application/json)
                value:
                  order_lines:
                  - accepted: true
                    id: Order_00012-B-1
              application/json-auto:
                summary: Complete example with value types (application/json)
                value:
                  order_lines:
                  - accepted: true
                    id: string
            schema:
              $ref: '#/components/schemas/OR21_Request'
      responses:
        '204':
          description: No Content
      security:
      - Operator-Bearer-Token: []
      - OAuth-2: []
      summary: OR21 - Accept or refuse order lines
      tags:
      - Orders
