  /api/orders/adjust:
    put:
      description: '<div class="extension-title">Description</div>


        <p>Update order line actual measurement either upwards or downwards, within the limit defined at the platform level.</p>


        <details>

        <summary>Error Codes</summary>


        | Code | Description |

        |------|-------------|

        | <code>ORDER_ADJUSTMENT_FEATURE_DISABLED</code> | The order adjustment feature is not enabled |

        | <code>ORDER_LINE_ADJUSTMENT_EQUAL_TO_ORDERED</code> | The actual measurement equals the ordered measurement |

        | <code>ORDER_LINE_ADJUSTMENT_EXCEEDS_DOWNWARD_LIMIT</code> | The downward adjustment exceeds the allowed limit |

        | <code>ORDER_LINE_ADJUSTMENT_EXCEEDS_UPWARD_LIMIT</code> | The upward adjustment exceeds the allowed limit |

        | <code>ORDER_LINE_ALREADY_ADJUSTED</code> | The order line has already been adjusted |

        | <code>ORDER_LINE_ALREADY_REFUNDED</code> | The order line has already been refunded |

        | <code>ORDER_LINE_DUPLICATE_ID</code> | The order lines list contains duplicate order line IDs |

        | <code>ORDER_LINE_INVALID_STATE</code> | Order lines are not in the expected state for this operation |

        | <code>ORDER_LINE_MISSING_MEASUREMENT</code> | The order line does not have a measurement unit |

        | <code>ORDER_LINE_NOT_FOUND</code> | The requested order line does not exist or is not associated with the order |

        | <code>ORDER_LINE_PAY_PER_SHIPMENT_NOT_ADJUSTABLE</code> | The order line cannot be adjusted with the current pay-per-shipment state |

        | <code>ORDER_LINE_PAY_PER_SHIPMENT_WAITING_DEBIT</code> | The order line is part of a shipment waiting for debit |

        | <code>ORDER_LINE_ZERO_AMOUNT</code> | The order line amount is zero |

        | <code>VALIDATION_ERROR</code> | Input validation failed |


        </details>



        <div class="api-description-extension">

        <div class="extension-title">Call Frequency</div>


        <div class="recommended-call-frequency">Recommended usage: At each adjustment of one or multiple order lines</div>

        <div class="max-call-frequency">Maximum usage: Once per minute, 100 order lines per call</div>

        </div>'
      operationId: OR32
      parameters: []
      requestBody:
        content:
          application/json:
            examples:
              application/json-0:
                summary: Example with business values (application/json)
                value:
                  order_lines:
                  - actual_measurement: 0.85
                    order_line_id: ORDER_0014-A-1
                  - actual_measurement: 1
                    order_line_id: ORDER_9999-A-1
              application/json-auto:
                summary: Complete example with value types (application/json)
                value:
                  order_lines:
                  - actual_measurement: 0
                    order_line_id: string
            schema:
              $ref: '#/components/schemas/OR32_Request'
      responses:
        '200':
          content:
            application/json:
              examples:
                application/json-0:
                  summary: Example with business values (application/json)
                  value:
                    order_lines_adjusted:
                    - cancelations:
                      - amount: 10.17
                        currency_iso_code: CAD
                        eco_contributions: []
                        quantity: 0
                        reason_code: SYSTEM_CANCELATION_ADJUSTMENT
                        shipping_amount: 0
                        shipping_taxes:
                        - amount: 0
                          code: ORDER_OFFER_SHIPPING_TAX
                        taxes:
                        - amount: 1.5
                          code: ORDER_OFFER_TAX
                      errors: []
                      measurement:
                        actual_measurement: 0.85
                        adjustment_limit: 20
                        measurement_unit: KILOGRAM
                        ordered_measurement: 1
                      order_line_id: ORDER_0014-A-1
                    - errors:
                      - code: ORDER_LINE_NOT_FOUND
                        field: order_line_id
                        message: Order line ORDER_9999-A-1 could not be found
                      order_line_id: ORDER_9999-A-1
                application/json-auto:
                  summary: Complete example with value types (application/json)
                  value:
                    order_lines_adjusted:
                    - cancelations:
                      - amount: 0
                        currency_iso_code: AED
                        eco_contributions:
                        - epr_category_code: string
                          producer_id: string
                          producer_id_owner: string
                          total_amount: 0
                          unit_amount: 0
                        quantity: 0
                        reason_code: string
                        shipping_amount: 0
                        shipping_taxes:
                        - amount: 0
                          code: string
                        taxes:
                        - amount: 0
                          code: string
                      errors:
                      - code: string
                        field: string
                        message: string
                      measurement:
                        actual_measurement: 0
                        adjustment_limit: 0
                        measurement_unit: GRAM
                        ordered_measurement: 0
                      order_line_id: string
                      refunds:
                      - amount: 0
                        currency_iso_code: AED
                        eco_contributions:
                        - epr_category_code: string
                          producer_id: string
                          producer_id_owner: string
                          total_amount: 0
                          unit_amount: 0
                        quantity: 0
                        reason_code: string
                        shipping_amount: 0
                        shipping_taxes:
                        - amount: 0
                          code: string
