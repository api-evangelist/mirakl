        style: form
      - description: End creation date for filtering
        explode: true
        in: query
        name: end_date
        required: false
        schema:
          type: string
          format: date-time
        style: form
      - description: Start update date for filtering. Mirakl will subtract a time delta to ensure no orders are missed due to network and/or software latency.
