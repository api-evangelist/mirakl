    OrderRequest:
      type: object
      properties:
        billing_info:
          $ref: '#/components/schemas/BillingInfoRequest'
        channel_order_id:
          type: string
          description: Unique identifier of the order on the channel. Must be unique across all orders of the channel. Combined with `origin.channel_id`, it forms the global Connect order identifier.
        channel_updated_at:
          type: string
          format: date-time
          description: 'Date and time of the last update on the channel. Connect uses this timestamp to handle updates versioning: an order is updated only if this value is greater or equal to the current stored value in Connect.  This means that an update whose `channel_updated_at` is older than the currently stored value will be silently ignored.'
        created_at:
          type: string
          format: date-time
          description: Date and time when the order was placed on the channel.
        custom_attributes:
          $ref: '#/components/schemas/CustomAttributesRequest'
        fulfillment:
          $ref: '#/components/schemas/FulfillmentRequest'
        has_incident:
          type: boolean
          description: Indicates whether the order has an active incident or dispute.
        order_lines:
          type: array
          description: Lines composing the order. Each line corresponds to one distinct product in a given quantity.
          items:
            $ref: '#/components/schemas/OrderLineRequest'
          minItems: 1
        shipping_info:
          $ref: '#/components/schemas/ShippingInfoRequest'
        status:
          type: string
          description: 'Current lifecycle status of the order.


            - `AWAITING_FRAUD_CHECK`: Order is pending fraud verification before being confirmed.

            - `AWAITING_ACCEPTANCE`: Order has been placed and is waiting for the seller to accept or refuse it.

            - `AWAITING_PAYMENT`: Order has been accepted but payment has not yet been confirmed.

            - `AWAITING_SHIPMENT`: Order is paid and accepted, waiting for the seller to ship.

            - `SHIPPED`: Order has been handed to a carrier.

            - `DELIVERED`: Order has been delivered to the buyer.

            - `CLOSED`: Order lifecycle is complete (delivered, cancelled, or refunded).

            - `CHANNEL_SPECIFIC`: The order has a status specific to the channel that does not map to any standard Connect status. Use `status_reason` to carry additional context.



            Enum: `"AWAITING_ACCEPTANCE"`, `"AWAITING_FRAUD_CHECK"`, `"AWAITING_PAYMENT"`, `"AWAITING_SHIPMENT"`, `"CHANNEL_SPECIFIC"`, `"CLOSED"`, `"DELIVERED"`, `"SHIPPED"`

            '
        status_reason:
          type: string
          description: 'Reason that explains why the order reached its current status.

            Typically used for terminal or exceptional statuses (e.g. `CLOSED`, `CHANNEL_SPECIFIC`).


            - `ACCEPTANCE_TIMEOUT`: Seller did not accept the order within the acceptance deadline.

            - `AUTOMATICALLY_CLOSED`: Order was automatically closed by the channel.

            - `CANCELED`: Order was cancelled.

            - `FRAUD_CHECK_FAILED`: Order failed fraud verification.

            - `FRAUD_CHECK_TIMEOUT`: Fraud check was not completed within the deadline.

            - `PAYMENT_TIMEOUT`: Payment was not received within the deadline.

            - `REFUNDED`: Order was fully refunded.

            - `REFUSED`: Order was refused by the seller.

            - `REFUSED_PAYMENT`: Payment was refused.



            Enum: `"ACCEPTANCE_TIMEOUT"`, `"AUTOMATICALLY_CLOSED"`, `"CANCELED"`, `"FRAUD_CHECK_FAILED"`, `"FRAUD_CHECK_TIMEOUT"`, `"PAYMENT_TIMEOUT"`, `"REFUNDED"`, `"REFUSED"`, `"REFUSED_PAYMENT"`

            '
        sub_channel_code:
          type: string
          description: Code of the sub-channel
      required:
      - channel_order_id
      - channel_updated_at
      - created_at
      - fulfillment
      - order_lines
      - shipping_info
      - status
