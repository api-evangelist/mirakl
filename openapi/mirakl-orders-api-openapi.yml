    get:
      description: '<div class="extension-title">Description</div>


        Returns a 400 Bad Request response if the limit of commercialIds, customerIds, offerIds or productSkus is exceeded.<br/>Pagination is enabled by default. For large requests, use asynchronous order export APIs OR13, OR14 and OR15 instead.<br/>


        <div class="api-description-extension">

        <div class="extension-title">Call Frequency</div>


        <div>Default:</div><div class="persona-specific-call-frequency"><div class="recommended-call-frequency">Recommended usage: <br/>- Asynchronous: every 5 minutes <br/>- Synchronous: at each order page display</div>

        <div class="max-call-frequency">Maximum usage: <br/>- Asynchronous: once per minute <br/>- Synchronous: at each order page display</div>

        </div><div>External Partner:</div><div class="persona-specific-call-frequency"><div class="recommended-call-frequency">Recommended usage: <br/>- Asynchronous: every 15 minutes <br/>- Synchronous: at each order page display</div>

        <div class="max-call-frequency">Maximum usage: <br/>- Asynchronous: every 15 minutes <br/>- Synchronous: at each order page display</div>

        </div><div class="extension-title">Read More</div>


        <ul><li><a href="https://help.mirakl.com/bundle/customers/page/topics/Mirakl/integration_guide/mcm_inte/enable_customer_care_service_to_access_order_status_details_mcm.html">More context (Customer Care - Order status & details)</a></li><li><a href="https://help.mirakl.com/bundle/customers/page/topics/Mirakl/integration_guide/mcm_inte/display_order_history_to_customer_mcm.html">More context (Displaying the order history to the customer)</a></li><li><a href="https://help.mirakl.com/bundle/customers/page/topics/Mirakl/integration_guide/mcm_inte/display_order_details_and_features_mcm.html">More context (Displaying order details & order follow-up)</a></li><li><a href="https://help.mirakl.com/bundle/customers/page/topics/Mirakl/integrating_mirakl/create_orders/organization_data.htm">If the customer organization feature is activated, read this page</a></li></ul><div class="extension-title">Pagination</div>


        <p>This resource supports offset pagination (<a href="#section/Offset-pagination-and-sort">see documentation</a>)</p>


        <div class="extension-title">Sort fields</div>


        <code>sort</code> field can have the following values:<ul><li><b>dateCreated</b> (Default) - Sort by creation date, and then by order identifier (asc by default)</li></ul>


        <div class="extension-title">Localization</div>


        <p>This resource supports <code>locale</code> parameter (<a href="#section/Locale">see documentation</a>)</p><p>Localized output fields will be highlighted with an icon: <span class="flag"></span></p></div>'
      operationId: OR11
