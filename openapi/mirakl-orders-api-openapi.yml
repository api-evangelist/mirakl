  /api/orders/documents/download:
    get:
      description: '<div class="extension-title">Description</div>


        <ul>   <li>If a list of document identifiers is specified only these documents are downloaded.       <ul>           <li>If more than one document id is specified, the documents will be wrapped in a ZIP archive</li>           <li>If only one document id is specified the document will not be zipped</li>       </ul>   </li>   <li>If a list of order identifiers is specified, all documents from those orders are downloaded.<br/>   Use a list of order document type codes to retrieve specific types from those orders.<br/>   In this case, the output of the API will always be a ZIP archive even if there is only one document to retrieve.   </li></ul>When documents are retrieved, they''re wrapped into a ZIP archive except when only one document id is specified. The tree structure of this archive is as follow:<pre>

        documents-timestamp.zip

        |

        |__ order_id_x/

        |   |__ foo.txt

        |   |__ bar.txt

        |   |__ baz.pdf

        |

        |__ order_id_y/

        |   |__ image.png

        |   |__ image(1).png

        </pre>


        <div class="api-description-extension">

        <div class="extension-title">Call Frequency</div>


        <div class="recommended-call-frequency">Recommended usage: At each document download</div>

        <div class="max-call-frequency">Maximum usage: At each document download</div>

        </div>'
      operationId: OR73
      parameters:
      - description: A list of identifiers of the orders (separated by a comma)
        explode: true
        in: query
        name: order_ids
        required: false
        schema:
          type: string
          maximum: 100
        style: form
      - description: A list of document identifiers (separated by a comma)
        explode: true
        in: query
        name: document_ids
        required: false
        schema:
          type: string
          maximum: 100
        style: form
      - description: A list of document type codes (separated by a comma)
        explode: true
        in: query
        name: document_codes
        required: false
        schema:
          type: string
          maximum: 100
        style: form
      responses:
        '200':
          content:
            application/octet-stream:
              examples:
                application/octet-stream-auto:
                  summary: Complete example with value types (application/octet-stream)
                  value: string
              schema:
                type: string
                format: binary
          description: OK
      security:
      - Operator-Bearer-Token: []
      - OAuth-2: []
      summary: OR73 - Download one or multiple documents attached to one or multiple orders
      tags:
      - Orders
  /api/orders/{order_id}/documents:
    post:
      description: "<div class=\"extension-title\">Description</div>\n\n<p>\n    Documents filenames must be distinct. Only documents of the following types are supported: csv, doc, xls, xlsx, ppt, pdf, odt, ods, odp, txt, rtf, png, jpg, gif, zpl, mov, mp4.</br>\n<span class='red'>An order can have a maximum of 50 documents.</span>\n    In the API output we include only documents with errors. All other documents are successfully uploaded.\n</p>\n<p>For system document types, there are specific restrictions :</p>\n<ul>\n    <li><code>SYSTEM_DELIVERY_BILL/SYSTEM_SHIPMENT_DELIVERY_BILL</code> : restricted to operator role.</li>\n    <li><code>SYSTEM_MESSAGE_ATTACHMENT</code> : cannot be directly uploaded to an order.</li>\n</ul>\n\n\n<div class=\"api-description-extension\">\n<div class=\"extension-title\">Call Frequency</div>\n\n<div class=\"recommended-call-frequency\">Recommended usage: At each document upload on an order</div>\n<div class=\"max-call-frequency\">Maximum usage: At each document upload on an order</div>\n<div class=\"extension-title\">Read More</div>\n\n<ul><li><a href=\"https://help.mirakl.com/bundle/customers/page/topics/Mirakl/integration_guide/mcm_inte/sellers_upload_invoices_mcm.html\">More context</a></li></ul></div>"
      operationId: OR74
      parameters:
      - description: The identifier of the order
        explode: false
        in: path
        name: order_id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          multipart/form-data:
            examples:
              multipart/form-data-auto:
                summary: Complete example with value types (multipart/form-data)
                value:
                  files:
                  - string
                  order_documents:
                    order_documents:
                    - entity:
                        id: string
                        type: RETURN
                      file_name: string
                      type_code: string
            schema:
              type: object
              properties:
                files:
                  type: array
                  description: 'The files to be uploaded. Use multipart/form-data with name ''files''. The file names must contain only US-ASCII characters. '
                  items:
                    type: string
                    format: binary
                order_documents:
                  $ref: '#/components/schemas/OR74_Request_MultipartFormData_OrderDocuments'
                  description: The list of documents to be uploaded details
              required:
              - files
              - order_documents
      responses:
        '200':
          content:
            application/json:
              examples:
                application/json-0:
                  summary: Example with business values (application/json)
                  value:
                    errors_count: 1
                    order_documents:
                    - errors:
                      - code: valid_order_document.type
                        field: type_code
                        message: Unable to retrieve document's type from the given code
                      input:
                        entity:
                          id: c0703388-df01-41c8-8a03-bc797c93515f
                          type: RETURN
                        file_name: return_label-38294.pdf
                        type_code: SYSTEM_RETURN_LABEL
                application/json-auto:
                  summary: Complete example with value types (application/json)
                  value:
                    errors_count: 0
                    order_documents:
                    - errors:
                      - code: string
                        field: string
                        message: string
                      input:
                        file_name: string
                        type_code: string
              schema:
                type: object
                $ref: '#/components/schemas/OR74_Response_200'
          description: OK
      security:
      - Operator-Bearer-Token: []
      - OAuth-2: []
      summary: OR74 - Upload documents to attach to an order
      tags:
      - Orders
      x-codeSamples:
      - lang: cURL
        source: "curl -i -X POST \\\n  https://your-instance.mirakl.net/api/orders/{order_id}/documents \\\n  -H 'Content-Type: multipart/form-data' \\\n  -F 'files=@path/to/file' \\\n  -F 'order_documents=\"{\\\"order_documents\\\":[{\\\"entity\\\":{\\\"id\\\":\\\"string\\\",\\\"type\\\":\\\"RETURN\\\"},\\\"file_name\\\":\\\"string\\\",\\\"type_code\\\":\\\"string\\\"}]}\";type=application/json'\n"
