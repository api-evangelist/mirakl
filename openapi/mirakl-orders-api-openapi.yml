  /api/orders/async-export:
    post:
      description: '<div class="extension-title">Description</div>


        <p>The API returns a tracking id to be used to query API OR14.<br />Mirakl recommends to use API OR13 instead of API OR11 as it can handle very large volumes of data.<br />You must give at least one date range filter: created, last updated date or refunds created date.<br />API OR13 supports the chunk of the export file into multiple files in order to:</p><ul><li>respect a maximum megabyte weight using the <code>megabytes_per_chunk</code> parameter.</li><li>respect a maximum amount of exported items using the <code>items_per_chunk</code> parameter.</li></ul><br />Only one export request can be created for all operator users, and one per partner.


        <div class="api-description-extension">

        <div class="extension-title">Call Frequency</div>


        <div class="recommended-call-frequency">Recommended usage: <br/>- Differential: every 15 minutes</div>

        <div class="max-call-frequency">Maximum usage: <br/>- Differential: every 5 minutes <br/>- Full: every 24 hours</div>

        <div class="extension-title">Localization</div>


        <p>This resource supports <code>locale</code> parameter (<a href="#section/Locale">see documentation</a>)</p><p>Localized output fields will be highlighted with an icon: <span class="flag"></span></p></div>'
      operationId: OR13
      parameters: []
      requestBody:
        content:
          application/json:
            examples:
              application/json-0:
                summary: Example with business values
                value:
                  channel_codes:
                  - US
                  end_date: '2022-01-31T00:00:00.000Z'
                  end_update_date: '2022-09-19T14:58:22.460Z'
                  fulfillment_center_codes: fulfillment_center_codes_001
                  items_per_chunk: 10000
                  megabytes_per_chunk: 100
                  only_null_channel: false
                  order_state_codes:
                  - WAITING_ACCEPTANCE
                  - SHIPPING
                  order_tax_mode: TAX_INCLUDED
                  refund_state_codes:
                  - WAITING_REFUND
                  shop_ids:
                  - 2310
                  start_date: '2022-01-01T00:00:00.000Z'
                  start_update_date: '2022-08-20T14:58:22.460Z'
                  tax_recalculation_required_only: true
                  waiting_funding_confirmation: false
                  waiting_tax_confirmation: false
              application/json-1:
                summary: Example with refund creation dates filters
                value:
                  end_refund_creation_date: '2019-09-20T14:58:22.460Z'
                  items_per_chunk: 10000
                  megabytes_per_chunk: 100
                  refund_state_codes:
                  - WAITING_REFUND
                  start_refund_creation_date: '2019-08-20T14:58:22.460Z'
              application/json-auto:
                summary: Complete example with value types (application/json)
                value:
                  channel_codes:
                  - string
                  end_date: '2023-03-28T09:34:42Z'
                  end_refund_creation_date: '2023-03-28T09:34:42Z'
                  end_update_date: '2023-03-28T09:34:42Z'
                  fulfillment_center_codes: string
                  items_per_chunk: 0
                  megabytes_per_chunk: 0
                  only_null_channel: true
                  order_state_codes:
                  - STAGING
                  order_tax_mode: TAX_INCLUDED
                  refund_state_codes:
                  - WAITING_REFUND_TAX_CONFIRMATION
                  shop_ids:
                  - 0
                  start_date: '2023-03-28T09:34:42Z'
                  start_refund_creation_date: '2023-03-28T09:34:42Z'
                  start_update_date: '2023-03-28T09:34:42Z'
                  tax_recalculation_required_only: true
                  waiting_funding_confirmation: true
                  waiting_tax_confirmation: true
            schema:
              $ref: '#/components/schemas/OR13_Request'
      responses:
        '200':
          content:
            application/json:
              examples:
                application/json-0:
                  summary: Example with business values
                  value:
                    tracking_id: tracking_id_001
                application/json-auto:
                  summary: Complete example with value types (application/json)
                  value:
                    tracking_id: string
              schema:
                type: object
                $ref: '#/components/schemas/OR13_Response_200'
          description: Asynchronous order export tracking creation success
      security:
      - Operator-Bearer-Token: []
      - OAuth-2: []
      summary: OR13 - Export orders asynchronously
      tags:
      - Orders
  /api/orders/async-export/status/{tracking_id}:
    get:
      description: '<div class="extension-title">Description</div>


        <p>Use this API to query the order export status after an API OR13 call.<br />Until the export via API OR13 is complete, the status returned by API OR14 is <code>PENDING</code>.<br />You must call API OR14 until you get the <code>COMPLETED</code> status which correspond to a completed and successful export from API OR13.<br />The URLs in API OR14 response contain all the files from API OR13 export.<br />Browse those urls and query them using the GET method.<br />In case of error, the status is <code>FAILED</code>.<br />In case of export canceled, the status is <code>CANCELED</code>.<br /></p>


        <div class="api-description-extension">

        <div class="extension-title">Call Frequency</div>


        <div class="recommended-call-frequency">Recommended usage: Every 10 seconds per OR13 call, until COMPLETED status is received</div>

        <div class="max-call-frequency">Maximum usage: Every 2 seconds per OR13 call, until COMPLETED status is received</div>

        </div>'
      operationId: OR14
      parameters:
      - description: Id of the previously created asynchronous order export
        explode: false
        in: path
        name: tracking_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        '200':
          content:
            application/json:
              examples:
                application/json-0:
                  summary: Example with business values (application/json)
                  value:
                    last_updated: '2022-08-18T15:20:22.906Z'
                    status: COMPLETED
                    urls:
                    - http://host:123/api/3f9edb57-9d8b-41e0-8b77-88d90caf7013?file=fileA
                    - http://host:123/api/3f9edb57-9d8b-41e0-8b77-88d90caf7013?file=fileB
                application/json-auto:
                  summary: Complete example with value types (application/json)
                  value:
                    last_updated: '2023-03-28T09:34:42Z'
                    status: string
                    urls:
                    - string
              schema:
                type: object
                $ref: '#/components/schemas/OR14_Response_200'
          description: Order asynchronous export tracking polling success
      security:
      - Operator-Bearer-Token: []
      - OAuth-2: []
      summary: OR14 - Get the status of an asynchronous order export.
      tags:
      - Orders
