                        street: string
                        city: string
                        first_name: string
                        company: string
                        street_additional_info: string
                        state: string
                        country: string
                        country_iso_code: string
                        zip_code: string
                        phone: string
                        additional_info: string
                      carrier: string
                      method: string
                      pudo_id: string
                      shipping_deadline: '2023-03-28T09:34:42Z'
                      delivery_date:
