            schema:
              $ref: '#/components/schemas/OR04_Request'
      responses:
        '200':
          content:
            application/json:
              examples:
                application/json-0:
                  summary: Response
                  value:
                    updated_orders:
                    - errors: []
                      order_id: Order_00014
                      updated:
                        customer:
                          accounting_contact:
                            customer_id: Customer_id_002
