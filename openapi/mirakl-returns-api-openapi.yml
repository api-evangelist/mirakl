    get:
      description: '<div class="extension-title">Description</div>


        Retrieve the list of the return label requests along with their details and states


        <div class="api-description-extension">

        <div class="extension-title">Call Frequency</div>


        <div class="recommended-call-frequency">Recommended usage: At each customer return label request</div>

        <div class="max-call-frequency">Maximum usage: At each customer return label request</div>

        <div class="extension-title">Pagination</div>


        <p>This resource supports seek pagination (<a href="#section/Seek-pagination-and-sort">see documentation</a>)</p>


        <div class="extension-title">Sort fields</div>


        <code>sort</code> field can have the following values:<ul><li><b>date_created</b> (Default) - Sort by label creation date (asc by default)</li></ul>


        </div>'
      operationId: RT52
      parameters:
      - description: Return id for filtering. This parameter can be supplied multiple times (return_id=58fd00d1-4ea4-453e-9a56-ec28c5c156ea&return_id=3071c162-dcd9-414b-a39d-ac3165f29453...). Limited to 100 values.
        explode: true
        in: query
        name: return_id
        required: false
        schema:
          type: array
          items:
            type: string
        style: form
      - description: Return label state for filtering. This parameter can be supplied multiple times (label_state=PENDING&label_state=CREATED...)
        explode: true
        in: query
        name: label_state
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - PENDING
            - CREATED
            - FAILED
        style: form
      - description: Filter labels created on or after the given date.
        explode: true
        in: query
        name: date_created_from
        required: false
        schema:
          type: string
          format: date-time
        style: form
      - description: Filter labels created on or before the given date.
        explode: true
        in: query
        name: date_created_to
        required: false
        schema:
          type: string
          format: date-time
        style: form
      - description: Filter labels last updated on or after the given date.
        explode: true
        in: query
        name: last_updated_from
        required: false
        schema:
          type: string
          format: date-time
        style: form
      - description: Filter labels last updated on or before the given date.
        explode: true
        in: query
        name: last_updated_to
        required: false
        schema:
          type: string
          format: date-time
        style: form
      responses:
        '200':
          content:
            application/json:
              examples:
                application/json-auto:
                  summary: Complete example with value types (application/json)
                  value:
                    data:
                    - date_created: '2023-03-28T09:34:42Z'
                      errors:
                      - code: string
                        message: string
                      estimated_cost:
                        amount: 0
                        currency_iso_code: AED
                      files:
                        label:
                          file_type: string
                          url: string
                        qr_code:
                          file_type: string
                          url: string
                      label_state: PENDING
                      last_updated: '2023-03-28T09:34:42Z'
                      return_id: string
                      tracking:
                        carrier_code: string
                        carrier_name: string
                        carrier_service_code: string
                        carrier_standard_code: string
                        tracking_number: string
                        tracking_url: string
                    next_page_token: string
                    previous_page_token: string
              schema:
                type: object
                $ref: '#/components/schemas/RT52_Response_200'
          description: OK
      security:
      - Front-Bearer-Token: []
      - OAuth-2: []
      summary: RT52 - List return labels
      tags:
      - Returns
    servers:
    - description: URL to be replaced by your Mirakl instance URL
      url: https://your-instance.mirakl.net
