components:
  schemas:
    RT21_Request_Returns:
      type: object
      description: 'Returns to be accepted, maximum number of returns per call: 100'
      properties:
        accepted:
          type: boolean
          description: Boolean indicating if the return is accepted or refused
        id:
          type: string
          description: Return id
        rejection_reason_code:
          type: string
          description: 'Return rejection reason code


            Enum: `"RETURN_REJECTION_NOT_ELIGIBLE"`, `"RETURN_REJECTION_NOT_NEEDED"`, `"RETURN_REJECTION_WINDOW_CLOSED"`

            '
      required:
      - accepted
      - id
    RT25_Response_200_ReturnErrors:
      type: object
      properties:
        id:
          type: string
          description: Return id
        message:
          type: string
          description: Error message
    UpsertReturnsRequest:
      type: object
      properties:
        origin:
          $ref: '#/components/schemas/OriginRequest'
        returns:
          type: array
          items:
            $ref: '#/components/schemas/ReturnRequest'
          maxItems: 100
          minItems: 1
      required:
      - origin
      - returns
    RT04_Response_200_ReturnSuccess_Tracking:
      type: object
      properties:
        carrier_code:
          type: string
          description: Carrier code
        carrier_name:
          type: string
          description: Carrier name
        carrier_standard_code:
          type: string
          description: Carrier standard code
        tracking_number:
          type: string
          description: Tracking number
        tracking_url:
          type: string
          description: Return tracking URL
    RT11_Response_200:
      type: object
      properties:
        data:
          type: array
          description: Page of data
          items:
            $ref: '#/components/schemas/RT11_Response_200_Data'
        next_page_token:
          type: string
          description: Token to access the next page. Absent if the current page is the last one.
        previous_page_token:
          type: string
          description: Token to access the previous page. Absent if the current page is the first one.
      required:
      - data
    RT01_Response_200_ReturnSuccess_Documents:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Return document id
        type:
          type: string
          description: Return document type
      required:
      - id
      - type
    RT26_Response_200:
      type: object
      properties:
        return_errors:
          type: array
          description: Returns update errors
          items:
            $ref: '#/components/schemas/RT26_Response_200_ReturnErrors'
        return_success:
          type: array
          description: Returns update success
          items:
            $ref: '#/components/schemas/RT26_Response_200_ReturnSuccess'
    RT11_Response_200_Data:
      type: object
      properties:
        date_created:
          type: string
          format: date-time
          description: Return creation date
        description:
          type: string
          description: Description
        documents:
          type: array
          description: Return documents
          items:
            $ref: '#/components/schemas/RT11_Response_200_Data_Documents'
        id:
          type: string
          description: Return id
        label_url:
          type: string
          description: Label URL
        last_updated:
          type: string
          format: date-time
          description: Return last updated date
        method_code:
          type: string
          description: 'Return method code


            Enum: `"RETURN_METHOD_BY_MAIL"`, `"RETURN_METHOD_DROP_OFF_POINT"`, `"RETURN_METHOD_HOME_PICKUP"`, `"RETURN_METHOD_IN_STORE"`, `"RETURN_METHOD_RETURNLESS"`

            '
        order_commercial_id:
          type: string
          description: Order commercial id
        order_id:
          type: string
          description: Order id
        reason_code:
          type: string
          description: 'Return reason code


            Enum: `"RETURN_BROKEN_ITEM"`, `"RETURN_CHANGED_MIND"`, `"RETURN_COUNTERFEIT_ITEM"`, `"RETURN_DAMAGED_PACKAGING"`, `"RETURN_DEFECTIVE_ITEM"`, `"RETURN_DELIVERED_PRODUCT_DIFFERENT"`, `"RETURN_MISSING_ITEM"`, `"RETURN_OTHER"`, `"RETURN_CM_DONT_WANT"`, `"RETURN_CM_DONT_LIKE"`, `"RETURN_CM_QUALITY"`, `"RETURN_DPD_WRONG_SIZE"`, `"RETURN_DPD_WRONG_COLOR"`, `"RETURN_DEFECTIVE_ON_ARRIVAL"`, `"RETURN_PRODUCT_DOES_NOT_FIT"`, `"RETURN_PDNT_TOO_BIG"`, `"RETURN_PDNT_TOO_SMALL"`, `"RETURN_INACCURATE_ITEM_DESCRIPTION"`, `"RETURN_WARRANTY"`

            '
        rejection_reason_code:
          type: string
          description: 'Return rejection reason code


            Enum: `"RETURN_REJECTION_NOT_ELIGIBLE"`, `"RETURN_REJECTION_NOT_NEEDED"`, `"RETURN_REJECTION_WINDOW_CLOSED"`

            '
        return_address:
          $ref: '#/components/schemas/RT11_Response_200_Data_ReturnAddress'
          description: The address where items must be returned
        return_lines:
          type: array
          description: Return lines
          items:
            $ref: '#/components/schemas/RT11_Response_200_Data_ReturnLines'
        rma:
          type: string
          description: Return RMA
        state:
          type: string
          description: 'Return state


            Enum: `"WAITING_ACCEPTANCE"`, `"IN_PROGRESS"`, `"REFUSED"`, `"RECEIVED"`, `"NO_RECEPTION"`, `"CLOSED"`, `"CANCELED"`

            '
        tracking:
          $ref: '#/components/schemas/RT11_Response_200_Data_Tracking'
          description: Return tracking details
      required:
      - date_created
      - id
      - last_updated
      - method_code
      - order_commercial_id
      - order_id
      - return_address
      - return_lines
      - state
    RT29_Request:
      type: object
      properties:
        returns:
          type: array
          description: Return ids
          items:
            $ref: '#/components/schemas/RT29_Request_Returns'
          maxItems: 100
          minItems: 1
      required:
      - returns
    RT29_Request_Returns:
      type: object
      description: Return ids
      properties:
        id:
          type: string
          description: Return id, must be a valid UUID
          maxLength: 36
          minLength: 0
      required:
      - id
    RT04_Request_Returns_Tracking:
