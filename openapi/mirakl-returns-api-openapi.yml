      properties:
        carrier_code:
          type: string
          description: Carrier Code
        carrier_name:
          type: string
          description: Carrier name
        carrier_standard_code:
          type: string
          description: Carrier Standard Code
        tracking_number:
          type: string
          description: Tracking number
        tracking_url:
          type: string
          description: Url tracking
          maxLength: 2000
    RT26_Request_Returns_ReturnLines:
