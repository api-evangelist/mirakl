components:
  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
          description: Error code (immutable)
          examples:
          - DATA_NOT_FOUND
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorItem'
        extensions:
          type: object
          description: Free map where you find additional context data to better describe the error
          examples:
          - maxLength: 255
            minLength: 1
        message:
          type: string
          description: Literal string error description (Please do not base your error handling on this field since it is subject to change)
          examples:
          - An error occurred while processing your request
      required:
      - code
      - message
    UpsertReturnsRequest:
      type: object
      properties:
        origin:
          $ref: '#/components/schemas/OriginRequest'
        returns:
          type: array
          items:
            $ref: '#/components/schemas/ReturnRequest'
          maxItems: 100
          minItems: 1
      required:
      - origin
      - returns
    ReturnErrorDetail:
      type: object
      properties:
        code:
          type: string
          description: Machine-readable error code
        field:
          type: string
          description: JsonPath to the field where the error occurred
        message:
          type: string
          description: Human-readable error message
      required:
      - code
      - message
    OriginRequest:
      type: object
      properties:
        channel_id:
          type: string
          description: Unique identifier of the sales channel
        channel_store_id:
          type: string
          description: Store identifier on the sales channel.
      required:
      - channel_id
      - channel_store_id
    ReturnLineRequest:
      type: object
      properties:
        channel_order_line_id:
          type: string
          description: Order line identifier on the sales channel
        quantity:
          type: integer
          description: Quantity of items being returned
        reason:
          type: string
          description: 'Reason for the return


            Enum: `"WRONG_ITEM"`, `"MISSING_ITEM"`, `"DEFECTIVE_ITEM"`, `"DAMAGED_ITEM"`, `"UNWANTED_ITEM"`, `"OTHER"`

            '
      required:
      - channel_order_line_id
      - quantity
      - reason
    ErrorItem:
      type: object
      properties:
        extensions:
          type: object
          description: Free map where you find additional context data to better describe the error
          examples:
          - maxLength: 255
            minLength: 1
        field:
          type: string
          description: JsonPath to the field where the error occurred
          examples:
          - input.account.id
        message:
          type: string
          description: Literal string error item description (Please do not base your error handling on this field since it is subject to change)
          examples:
          - 'An error occurred while processing your request: id is null'
      required:
      - message
    ReturnRequest:
      type: object
      properties:
        address:
          type: object
          properties:
            city:
              type: string
              description: City
            country:
              type: string
              description: Country
            country_iso_code:
              type: string
              format: iso-3166-1 alpha-3
              description: Country ISO code
            state:
              type: string
              description: State
            street:
              type: string
              description: Street information
            street_additional_info:
              type: string
              description: Additional street information
            zip_code:
              type: string
              description: Postal code
          required:
          - city
          - country_iso_code
          - street
        channel_order_id:
          type: string
          description: Order identifier on the sales channel
        channel_return_id:
          type: string
          description: Return identifier on the sales channel
        channel_updated_at:
          type: string
          format: date-time
          description: Date time the return was last updated on the sales channel
        created_at:
          type: string
          format: date-time
          description: Date time the return was created on the sales channel
        label_url:
          type: string
          description: URL for the return shipping label
        method:
          type: string
          description: Shipping method name on the sales channel
        rejection_reason:
          type: string
          description: 'Reason for the return rejection


            Enum: `"RETURN_WINDOW_CLOSED"`, `"NOT_ELIGIBLE_FOR_RETURN"`, `"FINAL_SALES"`, `"OTHER"`

            '
        return_lines:
          type: array
          items:
            $ref: '#/components/schemas/ReturnLineRequest'
          minItems: 1
        rma_id:
          type: string
          description: Return Merchandise Authorization ID
        status:
          type: string
          description: 'Current return status


            Enum: `"REQUEST_INITIATED"`, `"REQUEST_DECLINED"`, `"OPENED"`, `"RECEIVED"`, `"CLOSED"`, `"CHANNEL_SPECIFIC"`

            '
        sub_channel_code:
          type: string
          description: Code of the sub-channel
        tracking:
          type: object
          properties:
            carrier_name:
              type: string
              description: Carrier company name
            tracking_number:
              type: string
              description: Carrier tracking number
            tracking_url:
              type: string
              description: URL to track the return
      required:
      - channel_order_id
      - channel_return_id
      - channel_updated_at
      - created_at
      - return_lines
      - status
    UpsertReturnsResponse:
      type: object
      properties:
        return_errors:
          type: array
          items:
            type: object
            properties:
              channel_order_id:
                type: string
              channel_return_id:
                type: string
              details:
                type: array
                items:
                  $ref: '#/components/schemas/ReturnErrorDetail'
        return_success:
          type: array
          items:
            type: object
            properties:
              channel_order_id:
                type: string
              channel_return_id:
                type: string
    UpdateReturnTrackingInformationRequest:
      type: object
      properties:
        label_url:
          type: string
          description: Return label URL
          examples:
          - https://shipping.ups.com/returns/labels/d290f1ee-6c54-4b01-90e6-d701748f0851.pdf
        rma_id:
          type: string
          description: RMA ID (Return Merchandise Authorization)
          examples:
          - NL48GEQK22M1-A
        tracking:
          type: object
          description: Return tracking information
          properties:
            carrier:
              type: string
              description: "Carrier company name. For example:\n  - <code>UPS</code>\n  - <code>DHL Express</code>\n  - <code>Amazon Logistics UK</code>\n  - <code>FedEx</code>\n  - <code>China Post</code>\n  - ..."
              examples:
              - DHL Express
            tracking_number:
              type: string
              description: Carrier tracking number
              examples:
              - '781234567890'
            tracking_url:
              type: string
              description: URL to track the return
              examples:
              - https://www.fedex.com/fedextrack/?trknbr=781234567890
    AsynchronousActionResponse:
      type: object
      properties:
        action_id:
          type: string
          description: 'The unique identifier for the asynchronous action. It should be used with the [v2-getActionStatus API](#operation/v2-getActionStatus) to retrieve current action status and potential errors.

            '
          examples:
          - 1ba5fc4b-c4fd-4251-880b-3052e301bbd4
        tracking_id:
          type: string
          deprecated: true
          description: '**Deprecated:** This field was previously used to obtain the action ID. It has been replaced by `action_id` and contains the same value. It is retained for backward compatibility.

            '
          examples:
          - 1ba5fc4b-c4fd-4251-880b-3052e301bbd4
      required:
      - action_id
    AcceptReturnRequest:
      type: object
      properties:
        accepted:
          type: boolean
          description: Indicates if a return is accepted (true) or refused (false).
          examples:
          - true
        rejection_reason:
          type: string
          description: 'Reason for rejecting the return


            Enum: `"RETURN_WINDOW_CLOSED"`, `"NOT_ELIGIBLE_FOR_RETURN"`, `"FINAL_SALES"`

            '
      required:
      - accepted
    Origin:
      type: object
      properties:
        channel_id:
          type: string
          description: Unique identifier of the sales channel
        channel_name:
          type: string
          description: Name of the sales channel
        channel_store_id:
          type: string
          description: Store identifier on the sales channel. This identifier is not guaranteed to be unique as multiple channels can use the same identifier.
        channel_store_name:
          type: string
          description: Store public name on the sales channel
        sub_channel_code:
          type: string
          description: Code of the sub-channel
        sub_channel_name:
          type: string
          description: Name of the sub-channel
      required:
      - channel_id
    ReturnResponse:
      type: object
      properties:
        address:
          type: object
          properties:
            city:
              type: string
              description: City
            country:
              type: string
              description: Country
