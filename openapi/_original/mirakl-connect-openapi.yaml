  /v2/orders/{order_id}/refund:
    post:
      description: >-
        <div class="extension-title">Description</div>


        Use this API to refund order lines (all or part) of an order.


        <div class="api-description-extension">

        <div class="extension-title">Call Frequency</div>


        <div class="recommended-call-frequency">Recommended usage: At each
        refund request</div>

        <div class="max-call-frequency">Maximum usage: At each refund
        request</div>

        </div>
      operationId: v2-refundOrderLines
      parameters:
        - description: Order identifier in Mirakl Connect
          example: 0024_COMMERCIAL_ID-A
          explode: false
          in: path
          name: order_id
          required: true
          schema:
            type: string
          style: simple
      requestBody:
        content:
          application/json:
            examples:
              application/json-0:
                summary: Refund Order Lines Request
                value:
                  refunds:
                    - order_line_id: 0002_3202630-A-1
                      price:
                        amount: 15
                        currency: USD
                      product_id: '10000'
                      quantity: 1
                      reason: ITEM_NOT_RECEIVED
                      shipping_price:
                        amount: 8
                        currency: USD
                      shipping_taxes:
                        - amount:
                            amount: 3
                            currency: USD
                          code: ShippingTax1
                        - amount:
                            amount: 4
                            currency: USD
                          code: ShippingTax2
                      taxes:
                        - amount:
                            amount: 1
                            currency: USD
                          code: Tax1
                        - amount:
                            amount: 2
                            currency: USD
                          code: Tax2
              application/json-auto:
                summary: Complete example with value types (application/json)
                value:
                  refunds:
                    - order_line_id: 0002_3202630-A-2
                      product_id: SELLER_ID_1
                      reason: CUSTOMER_CANCELATION
                      quantity: 10
                      price:
                        amount: '1234.56'
                        currency: EUR
                      taxes:
                        - code: string
                          amount:
                            amount: '1234.56'
                            currency: EUR
                      shipping_price:
                        amount: '1234.56'
                        currency: EUR
                      shipping_taxes:
                        - code: string
                          amount:
                            amount: '1234.56'
                            currency: EUR
            schema:
              $ref: '#/components/schemas/RefundOrderLinesRequest'
        required: true
      responses:
        '202':
          content:
            application/json:
              examples:
                application/json-0:
                  summary: Refund Accepted Response
                  value:
                    action_id: 1ba5fc4b-c4fd-4251-880b-3052e301bbd4
                    tracking_id: 1ba5fc4b-c4fd-4251-880b-3052e301bbd4
                application/json-auto:
                  summary: Complete example with value types (application/json)
                  value:
                    action_id: 1ba5fc4b-c4fd-4251-880b-3052e301bbd4
                    tracking_id: 1ba5fc4b-c4fd-4251-880b-3052e301bbd4
              schema:
                $ref: '#/components/schemas/AsynchronousActionResponse'
          description: Accepted. The refund request will be processed asynchronously.
        '400':
          content:
            application/json:
              examples:
                application/json-auto:
                  summary: Complete example with value types (application/json)
                  value:
                    code: DATA_NOT_FOUND
                    message: An error occurred while processing your request
                    errors:
                      - message: >-
                          An error occurred while processing your request: id is
                          null
                        field: input.account.id
                        extensions:
                          minLength: 1
                          maxLength: 255
                    extensions:
                      minLength: 1
                      maxLength: 255
              schema:
                $ref: '#/components/schemas/Error'
          description: >-
            The order has not been updated because of wrong or missing
            parameters.
        '404':
          content:
            application/json:
              examples:
                application/json-auto:
                  summary: Complete example with value types (application/json)
                  value:
                    code: DATA_NOT_FOUND
                    message: An error occurred while processing your request
                    errors:
                      - message: >-
                          An error occurred while processing your request: id is
                          null
                        field: input.account.id
                        extensions:
                          minLength: 1
                          maxLength: 255
                    extensions:
                      minLength: 1
                      maxLength: 255
              schema:
                $ref: '#/components/schemas/Error'
          description: The order has not been updated because the order does not exist.
      security:
        - Bearer:
            - connect:order:refund
      summary: v2-refundOrderLines - Refund order lines
      tags:
        - Orders
  /v2/orders/actions:
    post:
      description: >-
        <div class="extension-title">Description</div>


        Use this API to report to Connect the results of actions performed on
        orders in your system, such as synchronizing  back orders. This enables
        enhanced error tracking while providing a centralized view of all  order
        actions and errors within the Connect interface.


        We recommend integrating this API when developing a connector, such as
        for a CMS, to ensure comprehensive tracking  of order actions and
        errors. This integration is optional if you process orders directly via
        the Connect API without using a connector.



        <div class="api-description-extension">

        <div class="extension-title">Call Frequency</div>


        <div class="recommended-call-frequency">Recommended usage: Every 5
        minutes</div>

        <div class="max-call-frequency">Maximum usage: Once per minute</div>

        </div>
      operationId: v2-reportOrderActions
      requestBody:
        content:
          application/json:
            examples:
              application/json-0:
                summary: Creation of a successful action
                value:
                  actions:
                    - entity_id: 0001_384722-A
                      entity_type: ORDER
                      executed_at: '2023-05-15T14:32:17Z'
                      status: SUCCESS
                      type: SYNCHRONIZE_ORDER
              application/json-1:
                summary: Creation of an action in error
                value:
                  actions:
                    - entity_id: 0002_3202630-A
                      entity_type: ORDER
                      errors:
                        - code: INVALID_PRODUCT_ID
                          message: The product ID does not exist
                      executed_at: '2023-05-15T14:32:17Z'
                      status: FAILED
                      type: SYNCHRONIZE_ORDER
              application/json-auto:
                summary: Complete example with value types (application/json)
                value:
                  actions:
                    - type: SYNCHRONIZE_ORDER
                      status: FAILED
                      entity_id: string
                      entity_type: ORDER
                      executed_at: '2025-06-30T16:46:00Z'
                      errors:
                        - code: INVALID_INPUT
                          message: string
            schema:
              $ref: '#/components/schemas/ActionRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                application/json-auto:
                  summary: Complete example with value types (application/json)
                  value:
                    actions:
                      - action_id: 1ba5fc4b-c4fd-4251-880b-3052e301bbd4
              schema:
                $ref: '#/components/schemas/ActionsCreatedResponse'
          description: Action successfully created
        '400':
          content:
            application/json:
              examples:
                application/json-auto:
                  summary: Complete example with value types (application/json)
                  value:
                    code: DATA_NOT_FOUND
                    message: An error occurred while processing your request
                    errors:
                      - message: >-
                          An error occurred while processing your request: id is
                          null
                        field: input.account.id
                        extensions:
                          minLength: 1
                          maxLength: 255
                    extensions:
                      minLength: 1
                      maxLength: 255
              schema:
                $ref: '#/components/schemas/Error'
          description: >-
            Invalid request - input does not match schema or contains invalid
            values
      security:
        - Bearer:
            - connect:order:action:write
      summary: v2-reportOrderActions - Log order action results and errors
      tags:
        - Orders
