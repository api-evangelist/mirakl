  /v2/orders/documents:
    get:
      description: >-
        <div class="extension-title">Description</div>


        Use this API to retrieve documents across orders with pagination
        support.


        Each document in the response includes its associated order_id along
        with metadata such as name, type, size, and last update date.


        Documents are returned as a flat list sorted by updated_at in descending
        order (most recent first).



        <div class="api-description-extension">

        <div class="extension-title">Call Frequency</div>


        <div class="recommended-call-frequency">Recommended usage: When you need
        to retrieve documents for orders</div>

        <div class="max-call-frequency">Maximum usage: When you need to retrieve
        documents for orders</div>

        <div class="extension-title">Pagination</div>


        <p>This resource supports seek pagination (<a
        href="#section/Seek-pagination-and-sort">see documentation</a>)</p>


        <div class="extension-title">Sort fields</div>


        <code>sort</code> field can have the following
        values:<ul><li><b>updated_at</b> (Default) - Sort by document last
        update time (desc by default)</li></ul>


        </div>
      operationId: v2-listOrderDocuments
      parameters:
        - description: >-
            Optional list of order identifiers in Mirakl Connect to filter
            documents
          example:
            - 0024_COMMERCIAL_ID-A
            - 0024_COMMERCIAL_ID-B
          explode: true
          in: query
          name: order_ids
          required: false
          schema:
            type: array
            items:
              type: string
          style: form
        - description: Filter by Connect document types
          explode: true
          in: query
          name: types
          required: false
          schema:
            type: array
            items:
              type: string
              enum:
                - RETURN_LABEL
                - CUSTOMER_INVOICE
                - DELIVERY_SLIP
                - SHIPMENT_DELIVERY_SLIP
                - CHANNEL_SPECIFIC
          style: form
        - description: >
            Filter by channel-specific document types.


            Only applicable when one of the types is
            <code>CHANNEL_SPECIFIC</code>.
          explode: true
          in: query
          name: channel_types
          required: false
          schema:
            type: array
            items:
              type: string
          style: form
        - description: >-
            Select documents that were last updated in Mirakl Connect from the
            specified date time.
          explode: true
          in: query
          name: updated_from
          required: false
          schema:
            type: string
            format: date-time
            example: '2024-01-15T10:30:00Z'
          style: form
        - description: Token to access a specific page of results
          explode: true
          in: query
          name: page_token
          required: false
          schema:
            type: string
          style: form
        - description: Maximum number of documents to return per page
          explode: true
          in: query
          name: limit
          required: false
          schema:
            type: integer
            default: 50
            maximum: 100
            minimum: 1
          style: form
      responses:
        '200':
          content:
            application/json:
              examples:
                application/json-auto:
                  summary: Complete example with value types (application/json)
                  value:
                    previous_page_token: string
                    next_page_token: string
                    documents:
                      - id: doc-uuid-1234-5678-90ab-cdef
                        name: invoice_2024.pdf
                        type: CUSTOMER_INVOICE
                        channel_type: string
                        size_in_bytes: 245680
                        file_format: application/pdf
                        updated_at: '2024-10-15T14:30:00Z'
                        order_id: 0024_COMMERCIAL_ID-A
              schema:
                $ref: '#/components/schemas/OrderDocumentsPageResponse'
          description: List of documents sorted by updated_at in descending order
        '400':
          content:
            application/json:
              examples:
                application/json-auto:
                  summary: Complete example with value types (application/json)
                  value:
                    code: DATA_NOT_FOUND
                    message: An error occurred while processing your request
                    errors:
                      - message: >-
                          An error occurred while processing your request: id is
                          null
                        field: input.account.id
                        extensions:
                          minLength: 1
                          maxLength: 255
                    extensions:
                      minLength: 1
                      maxLength: 255
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid parameters.
      security:
        - Bearer:
            - connect:order-document:read
      summary: v2-listOrderDocuments - List documents
      tags:
        - Orders
  /v2/orders:
    get:
      description: >-
        <div class="extension-title">Description</div>


        Use this API to synchronize Mirakl Connect orders with your system. We
        recommend integrating this API in asynchronous mode. You can retrieve
        all orders updated since the last call, and update your referential
        accordingly. To do so, schedule a task that calls this API using the
        <code>updated_from</code> parameter valued with the last execution time
        of the task.


        <div class="api-description-extension">

        <div class="extension-title">Call Frequency</div>


        <div class="recommended-call-frequency">Recommended usage: Asynchronous:
        every 5 minutes</div>

        <div class="max-call-frequency">Maximum usage: Asynchronous: once per
        minute</div>

        <div class="extension-title">Pagination</div>


        <p>This resource supports seek pagination (<a
        href="#section/Seek-pagination-and-sort">see documentation</a>)</p>


        <div class="extension-title">Sort fields</div>


        <code>sort</code> field can have the following
        values:<ul><li><b>updated_at</b> (Default) - Sort by date time of last
        order modification in Mirakl Connect (desc by
        default)</li><li><b>created_at</b> - Sort by date time the order was
        created on the sales channel (desc by default)</li></ul>


        </div>
      operationId: v2-listOrders
      parameters:
        - description: Filter by Connect order identifiers
          explode: true
