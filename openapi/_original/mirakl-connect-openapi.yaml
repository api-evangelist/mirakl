  /conversations/{conversationId}/attachments:
    get:
      description: >-
        <div class="extension-title">Description</div>


        Downloads a ZIP archive of the requested attachments from a
        conversation.

        ZIP archive contains all matching attachments with the following
        structure :


        ```

        ├── <message_id_1>/

        │   ├── <attachment_id_1>/

        │   │   └── <filename1>

        │   └── <attachment_id_2>/

        │       └── <filename2>

        └── <message_id_2>/
            └── <attachment_id_3>/
                └── <filename3>
        ```


        The zip file will be named with the following pattern :
        <conversation_id>_attachments_<timestamp>.zip


        Unknown or deleted attachments are silently skipped.



        <div class="api-description-extension">

        </div>
      operationId: downloadConversationAttachments
      parameters:
        - description: The ID of the conversation from listConversations API.
          explode: false
          in: path
          name: conversationId
          required: true
          schema:
            type: string
          style: simple
        - description: >-
            A list of attachment ID to retrieve. If not specified, all
            attachments of the conversation are returned.
          explode: true
          in: query
          name: attachment_ids
          required: false
          schema:
            type: array
            items:
              type: string
            maxItems: 100
          style: form
      responses:
        '200':
          content:
            application/zip:
              examples:
                application/zip-auto:
                  summary: Complete example with value types (application/zip)
                  value: string
              schema:
                $ref: '#/components/schemas/ZipArchive'
          description: ZIP archive of the requested attachments
        '404':
          content:
            application/json:
              examples:
                application/json-auto:
                  summary: Complete example with value types (application/json)
                  value:
                    code: DATA_NOT_FOUND
                    message: An error occurred while processing your request
                    errors:
                      - message: >-
                          An error occurred while processing your request: id is
                          null
                        field: input.account.id
                        extensions:
                          minLength: 1
                          maxLength: 255
                    extensions:
                      minLength: 1
                      maxLength: 255
              schema:
                $ref: '#/components/schemas/Error'
          description: >-
            Conversation not found or anonymized, or no attachments found for
            the given parameters
      security:
        - Bearer:
            - connect:conversation:read
      summary: downloadConversationAttachments - Download attachments of a conversation
      tags:
        - Conversations
  /conversations/actions/{actionId}:
    get:
      description: >-
        <div class="extension-title">Description</div>


        Use this API to check the status of your asynchronous conversation
        action.


        <div class="api-description-extension">

        </div>
      operationId: getConversationActionStatus
      parameters:
        - description: Unique identifier of the action
          explode: false
          in: path
          name: actionId
          required: true
