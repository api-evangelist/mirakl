      description: >-
        <div class="extension-title">Description</div>


        Use this API to accept or refuse order lines that are in the
        <code>AWAITING_ACCEPTANCE</code> status, from Mirakl Connect. The API
        also synchronizes the order line status on the sales channel.


        <div class="api-description-extension">

        <div class="extension-title">Call Frequency</div>


        <div class="recommended-call-frequency">Recommended usage: On each new
        order</div>

        <div class="max-call-frequency">Maximum usage: On each new order</div>

        </div>
      operationId: v2-acceptOrderLines
      parameters:
        - description: Order identifier in Mirakl Connect
          example: 0024_COMMERCIAL_ID-A
          explode: false
          in: path
          name: order_id
          required: true
          schema:
            type: string
          style: simple
      requestBody:
        content:
          application/json:
            examples:
              application/json-0:
                summary: Accept order request
                value:
                  order_lines:
                    - accepted: true
                      id: 0002_3202630-A-1
                    - accepted: false
                      id: 0002_3202630-A-2
              application/json-auto:
                summary: Complete example with value types (application/json)
                value:
                  order_lines:
                    - id: 0002_3202630-A-2
                      accepted: true
            schema:
              $ref: '#/components/schemas/AcceptOrderLinesRequest'
        required: true
      responses:
        '202':
          content:
            application/json:
              examples:
                application/json-0:
                  summary: Accepted Response
                  value:
                    action_id: 1ba5fc4b-c4fd-4251-880b-3052e301bbd4
                    tracking_id: 1ba5fc4b-c4fd-4251-880b-3052e301bbd4
                application/json-auto:
                  summary: Complete example with value types (application/json)
                  value:
                    action_id: 1ba5fc4b-c4fd-4251-880b-3052e301bbd4
                    tracking_id: 1ba5fc4b-c4fd-4251-880b-3052e301bbd4
              schema:
                $ref: '#/components/schemas/AsynchronousActionResponse'
          description: Accepted. The accept request will be processed asynchronously.
        '400':
          content:
            application/json:
              examples:
                application/json-auto:
                  summary: Complete example with value types (application/json)
                  value:
                    code: DATA_NOT_FOUND
                    message: An error occurred while processing your request
                    errors:
                      - message: >-
                          An error occurred while processing your request: id is
                          null
                        field: input.account.id
                        extensions:
                          minLength: 1
                          maxLength: 255
                    extensions:
                      minLength: 1
                      maxLength: 255
              schema:
                $ref: '#/components/schemas/Error'
          description: >-
            The order status has not been updated because of wrong or missing
            parameters.
        '404':
          content:
            application/json:
              examples:
                application/json-auto:
                  summary: Complete example with value types (application/json)
                  value:
                    code: DATA_NOT_FOUND
                    message: An error occurred while processing your request
                    errors:
                      - message: >-
                          An error occurred while processing your request: id is
