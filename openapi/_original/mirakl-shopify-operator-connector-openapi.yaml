  /api/setup/check-consistency:
    get:
      description: >-
        <div class="extension-title">Description</div>


        Description: Verifies whether the data initialized during the
        application's installation is still up to date. It compares the
        currently used data with the initial or expected version and returns an
        update status indicator. This ensures data consistency and helps detect
        potential refresh needs.


        <div class="api-description-extension">

        <div class="extension-title">Call Frequency</div>


        <div class="recommended-call-frequency">Recommended usage: <br/>- When
        you need to check initialized data</div>

