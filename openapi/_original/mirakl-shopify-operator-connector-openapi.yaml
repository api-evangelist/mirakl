              -H 'Content-Type: multipart/form-data' \
              -F 'files=@path/to/file' \
              -F 'returnRequest="{\"description\":\"string\",\"methodCode\":\"RETURN_METHOD_BY_MAIL\",\"orderLogisticId\":\"string\",\"reasonCode\":\"RETURN_BROKEN_ITEM\",\"returnLines\":[{\"orderLineId\":\"string\",\"quantity\":0}]}";type=application/json'
