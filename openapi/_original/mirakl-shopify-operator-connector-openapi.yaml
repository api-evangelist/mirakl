        Mirakl. This operation also cleans up the middleware by deleting the
        corresponding product bindings for both third-party (3P) and first-party
        (1P) products. The operation is asynchronous and scheduled to run
        periodically, so manual triggering is typically not required.


        <div class="api-description-extension">

        <div class="extension-title">Call Frequency</div>


        <div class="recommended-call-frequency">Recommended usage: <br/>- Only
        when you need to trigger the synchronization manually.</div>

        <div class="max-call-frequency">Maximum usage: <br/>- You can run only
        one Mirakl deleted products synchronization at a time</div>

        </div>
      operationId: SyncDeletedMiraklProducts
      parameters: []
      requestBody:
        content:
          application/json:
            examples:
              application/json-0:
                summary: >-
                  Example with business values for synchronization using since
                  date from configuration (application/json)
                value: {}
              application/json-1:
                summary: >-
                  Example with business values for full synchronization
                  (application/json)
                value:
                  sinceDate: null
              application/json-2:
                summary: >-
                  Example with business values for synchronization using defined
                  since date (application/json)
                value:
                  sinceDate: '2025-08-01T00:00:00Z'
              application/json-auto:
                summary: Complete example with value types (application/json)
                value:
                  deletedSince: '2023-03-28T09:34:42Z'
            schema:
              $ref: '#/components/schemas/SyncDeletedMiraklProducts_Request'
      responses:
        '202':
          description: >-
            A deleted Mirakl products synchronization to Shopify has
            successfully been scheduled.
        '425':
          description: >-
            A deleted Mirakl products synchronization to Shopify task is already
            running. Please wait for the task to complete before starting a new
            one.
      summary: >-
        SyncDeletedMiraklProducts - Synchronize deleted products from Mirakl to
