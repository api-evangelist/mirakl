                files:
                  type: array
                  description: List of attachments for the return
                  items:
                    type: string
                    format: binary
                returnRequest:
                  $ref: >-
                    #/components/schemas/CreateReturn_Request_MultipartFormData_Returnrequest
                  description: The return data
              required:
                - returnRequest
