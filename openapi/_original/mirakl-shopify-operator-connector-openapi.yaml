  /api/storefront/graphql:
    post:
      description: >-
        > ⚠️ **Content-length header**

        >

        > The Content-Length header must be present with value 0, even when
        there is no request body.


        <div class="extension-title">Description</div>


        For security reasons, not all fields are available depending on the
        context. For example, it is not possible to query the additional fields
        from the storefront.<br/>For offers queries, the customer location
        headers are used to resolve the operator shipping zone, which always
        overwrites the shippingZones filter of the offers input before the query
        is forwarded to Mirakl. When the X-Customer-Country header is absent,
        the query is forwarded unchanged.


        <div class="api-description-extension">

        <div class="extension-title">Call Frequency</div>


        <div class="recommended-call-frequency">Recommended usage: <br/>- When
        you want to retrieve data from Mirakl GraphQL API</div>

        </div>
      operationId: MiraklGraphQL
      parameters:
        - deprecated: false
          description: >-
            ISO2 country code of the customer (case-insensitive), used to
            resolve the operator shipping zone injected in offers queries
          explode: false
          in: header
          name: X-Customer-Country
          required: false
          schema:
            type: string
          style: simple
        - deprecated: false
          description: >-
            Zip/postal code of the customer, used to refine the shipping zone
            resolution. Ignored when X-Customer-Country is absent
          explode: false
          in: header
          name: X-Customer-Zip
          required: false
          schema:
            type: string
          style: simple
        - deprecated: false
          description: >-
            Province/state code of the customer, used to refine the shipping
            zone resolution. Ignored when X-Customer-Country is absent
          explode: false
          in: header
          name: X-Customer-Province
          required: false
          schema:
            type: string
          style: simple
      responses:
        '200':
          description: OK
      summary: MiraklGraphQL - Forward request to Mirakl GraphQL API
      tags:
        - Storefront
