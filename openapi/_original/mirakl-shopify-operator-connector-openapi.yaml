          description: The Shopify root attribute code
    UpdateSettings_Response_200_ShippingZoneMapping:
      type: object
      description: Shipping zone mapping response
      properties:
        countries:
          type: array
          description: List of countries who override the default shipping zone code
          items:
            $ref: >-
              #/components/schemas/UpdateSettings_Response_200_ShippingZoneMapping_Countries
        shippingZone:
          type: string
          description: The default shipping zone code
    UpdateSettings_Response_200_ShippingZoneMapping_Countries:
      type: object
      properties:
        iso2Code:
          type: string
          description: The ISO 2 code for the country
        provinces:
          type: array
          description: >-
            List of province who override the shipping zone code (not checked if
            override is found in zips list)
          items:
            $ref: >-
              #/components/schemas/UpdateSettings_Response_200_ShippingZoneMapping_Countries_Provinces
        shippingZone:
          type: string
          description: The shipping zone for the country
        zips:
          type: array
          description: >-
            List of zip who override the shipping zone code. The code must match
            the beginning of customer the zip code (ex: `K2` and `K2P` will
            match the customer zip code `K2P-2L8` but `K2P` will be prioritized)
          items:
            $ref: >-
              #/components/schemas/UpdateSettings_Response_200_ShippingZoneMapping_Countries_Zips
    UpdateSettings_Response_200_ShippingZoneMapping_Countries_Provinces:
      type: object
      properties:
        code:
          type: string
          description: The code
        shippingZone:
          type: string
          description: The shipping zone code
    UpdateSettings_Response_200_ShippingZoneMapping_Countries_Zips:
      type: object
      properties:
        code:
          type: string
          description: The code
        shippingZone:
          type: string
          description: The shipping zone code
    UpdateSettings_Response_200_Shop:
      type: object
      description: Shop settings response
      properties:
        shopMiraklCustomFields:
          type: array
          description: List of Mirakl shop custom attributes to map
          items:
            $ref: >-
              #/components/schemas/UpdateSettings_Response_200_Shop_ShopMiraklCustomFields
    UpdateSettings_Response_200_Shop_ShopMiraklCustomFields:
      type: object
      description: Mirakl shop custom field response
      properties:
        code:
          type: string
          description: The Mirakl custom field code
    UpdateSettings_Response_200_TaxonomyMetafields:
      type: object
      description: Taxonomy metafield response
      properties:
        key:
          type: string
          description: >-
            The unique identifier for the metafield definition within its
            namespace
        localizable:
          type: boolean
          description: Whether this metafield can be translated
        namespace:
          type: string
          description: The namespace for the metafield definition
        ownerType:
          type: string
          description: >-
            The resource type that the metafield definition is attached to
            (PRODUCT or PRODUCTVARIANT)
