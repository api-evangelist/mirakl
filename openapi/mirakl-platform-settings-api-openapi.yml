                    - logistic_class_code: S
                      overridden_by_shop: true
                      prices:
                        additional_price: 2
                        free_shipping_threshold: null
                        initial_price: 3
                        type: FIXED_PRICE
                      shipping_method_code: STD
                      shipping_zone_code: DOM1
                    - logistic_class_code: M
