      - label
    SH52_Response_200_Configuration_Prices:
      type: object
      properties:
        additional_price:
          type: number
          format: with decimals
          description: The value of the additional price per additional offer unit in the order. Not applicable when type is FREE_SHIPPING or ORDER_RANGE.
        free_shipping_threshold:
          type: number
          format: with decimals
          description: The minimum order value threshold, above which shipping becomes free for the customer. Not applicable when type is ORDER_RANGE.
        initial_price:
          type: number
          format: with decimals
          description: The value of the standard shipping price. Not applicable when type is FREE_SHIPPING or ORDER_RANGE.
        ranges:
          type: array
          description: The details of the shipping price ranges. Applicable only when type is ORDER_RANGE.
          items:
            $ref: '#/components/schemas/SH52_Response_200_Configuration_Prices_Ranges'
        type:
