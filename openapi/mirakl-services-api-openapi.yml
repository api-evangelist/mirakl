                        service_configuration:
                          maximum_number_of_elements: 0
                          minimum_number_of_elements: 0
                        type: BOOLEAN
                      description: string
                      location:
                        type: NO_LOCATION
                      pricing:
                        options:
                        - code: string
                          label: string
                          order_configuration:
                            maximum_number_of_elements: 0
                          type: BOOLEAN
                        price_per_unit_options:
                        - code: string
                          label: string
                          order_configuration:
                            minimum_number_of_elements: 0
                          service_configuration:
                            minimum_number_of_elements: 0
                          type: VALUE_LIST
                          values:
                          - code: string
                            label: string
                        type: FIXED_PRICE
                      quantity:
                        on_marketplace:
                        - ALLOW_UNLIMITED
                        per_order:
                        - ALLOW_UNLIMITED
                      title: string
                    next_page_token: string
                    previous_page_token: string
              schema:
                type: object
                $ref: '#/components/schemas/SM11_Response_200'
          description: OK
      summary: SM11 - List service models
      tags:
      - Services
    servers:
    - description: URL to be replaced by your Mirakl instance URL
