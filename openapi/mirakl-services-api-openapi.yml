openapi: 3.2.0
info:
  title: Mirakl Services API
  version: ''
  description: 'Operations tagged Services across 3 of this provider''s published API definitions: mirakl-mms-front-openapi.yaml, mirakl-mms-operator-openapi.json, mirakl-mms-seller-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- description: URL to be replaced by your Mirakl instance URL
  url: https://your-instance.mirakl.net
tags:
- name: Services
paths:
  /api/mms/models:
    get:
      description: '<div class="api-description-extension">

        <div class="extension-title">Call Frequency</div>


        <div class="recommended-call-frequency">Recommended usage: <br/>- Asynchronous: once per day <br/>- Synchronous: at each faceting display</div>

        <div class="max-call-frequency">Maximum usage: <br/>- Asynchronous: every hour <br/>- Synchronous: at each faceting display</div>

        <div class="extension-title">Read More</div>


        <ul><li><a href="https://help.mirakl.com/bundle/customers/page/topics/Mirakl/service_features/integrating_services/displaying_services.htm">More context</a></li></ul><div class="extension-title">Pagination</div>


        <p>This resource supports seek pagination (<a href="#section/Seek-pagination-and-sort">see documentation</a>)</p>


        <div class="extension-title">Sort fields</div>


        <code>sort</code> field can have the following values:<ul><li><b>title</b> - Sort by title (asc by default)</li><li><b>code</b> (Default) - Sort by code (asc by default)</li></ul>


        </div>'
      operationId: SM11
      parameters:
      - description: 'Category codes to include in result. (default: include all)'
        explode: true
        in: query
        name: category_code
        required: false
        schema:
          type: array
          items:
            type: string
        style: form
      - description: 'Model codes to include in result. (default: include all)'
        explode: true
        in: query
        name: model_code
        required: false
        schema:
          type: array
          items:
            type: string
        style: form
      - description: 'Location types to include in result. (default: include all)'
        explode: true
        in: query
        name: location_type
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - NO_LOCATION
            - AT_CUSTOMER_LOCATION
            - AT_SHOP_LOCATION
        style: form
      - description: 'Booking types to include in result. (default: include all)'
        explode: true
        in: query
        name: booking_type
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - NO_BOOKING
            - DATETIME_REQUEST
            - SCHEDULED_EVENTS
        style: form
      - description: 'Consumption types to include in result. (default: include all)'
        explode: true
        in: query
        name: consumption_type
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - VOUCHER
            - CONFIRMATION_BY_SHOP
        style: form
      responses:
        '200':
          content:
            application/json:
              examples:
                application/json-0:
                  summary: Example with business values
                  value:
                    data:
                    - booking:
                        type: DATETIME_REQUEST
                      categories:
                      - code: LOGO_DESIGN
                        label: Logo Design
                      code: LOGO
                      consumption:
                        type: VOUCHER
                      custom_attributes:
                      - code: DISABLED_ACCESSIBILITY
                        label: Accessible to disabled
                        service_configuration:
                          minimum_number_of_elements: 1
                        type: BOOLEAN
                      - code: HEIGHT_DIFF
                        label: Height difference
                        precision: 2
                        service_configuration:
                          minimum_number_of_elements: 0
                        type: DECIMAL
                      - code: AGE_MIN
                        label: Age minimum
                        service_configuration:
                          minimum_number_of_elements: 1
                        type: INTEGER
                      - available_values:
                        - code: HIKING_STICKS
                          label: hiking sticks
                        - code: ADAPTED_OUTFIT
                          label: adapted outfit
                        - code: BOOTS
                          label: boots
                        code: EQUIPT_TO_BRING
                        label: Equipment & gear to bring
                        service_configuration:
                          minimum_number_of_elements: 0
                        type: VALUE_LIST
                      - code: PREMIUM_PACKAGE
                        label: Premium package
                        order_configuration:
                          maximum_number_of_elements: 1
                          shop_permission: READ_WRITE
                        service_configuration:
                          minimum_number_of_elements: 0
                        type: BOOLEAN
                      location:
                        type: NO_LOCATION
                      pricing:
                        options:
                        - code: BRING_YOUR_OWN_MATERIAL
                          label: Bring your own material
                          service_configuration:
                            minimum_number_of_elements: 1
                          type: BOOLEAN
                        - available_values:
                          - code: ONE_HOUR
                            label: 1 hour
                          - code: TWO_HOURS
                            label: 2 hours
                          - code: THREE_HOURS
                            label: 3 hours
                          code: WORK_DURATION
                          label: Work duration
                          order_configuration:
                            maximum_number_of_elements: 1
                          service_configuration:
                            description_allowed: true
                            maximum_number_of_elements: 1
                            minimum_number_of_elements: 0
                          type: VALUE_LIST
                        type: FIXED_PRICE
                      quantity:
                        on_marketplace:
                        - ALLOW_UNLIMITED
                        per_order:
                        - ALLOW_FIXED
                      title: What do you need to ask for a logo design ?
                    - booking:
                        type: NO_BOOKING
                      categories:
                      - code: ATM_REPAIR
                        label: ATM Repair
                      - code: DISHWASHER
                        label: Dishwasher
