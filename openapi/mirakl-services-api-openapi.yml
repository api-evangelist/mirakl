                    next_page_token: bGltaXQ9MSZhZnRlcj1PVEhFUl9SRVBBSVImc29ydD1jb2RlLEFTQw==.FLjQC3Q1O1OGr6XXmWaZD0fwJgrv1fir6fi-i9sl8Cs=
                application/json-2:
                  summary: Example with multi price
                  value:
                    data:
                    - booking:
                        type: DATETIME_REQUEST
                      categories:
                      - code: YOGA_CLASSES
                        label: Yoga classes
                      code: PRIVATE_YOGA_LESSON
                      consumption:
                        type: VOUCHER
                      custom_attributes: []
                      description: Model regrouping yoga lessons at customer location.
                      location:
                        type: AT_CUSTOMER_LOCATION
                      pricing:
                        price_per_unit_options:
                        - code: YOGA_MEMBER_STATUS
                          label: Member status
                          order_configuration:
                            minimum_number_of_elements: 1
                          service_configuration:
                            minimum_number_of_elements: 1
                          type: VALUE_LIST
                          values:
                          - code: NORMAL
                            label: Normal
                          - code: MEMBER
                            label: Member
                        type: FIXED_PRICE_MULTI
                      quantity:
                        on_marketplace:
                        - ALLOW_UNLIMITED
                        per_order:
                        - ALLOW_UNLIMITED
                      title: Private yoga lesson
                    next_page_token: bGltaXQ9MSZhZnRlcj1PVEhFUl9SRVBBSVImc29ydD1jb2RlLEFTQw==.FLjQC3Q1O1OGr6XXmWaZD0fwJgrv1fir6fi-i9sl8Cs=
                application/json-auto:
                  summary: Complete example with value types (application/json)
                  value:
                    data:
                    - booking:
                        type: NO_BOOKING
                      categories:
                      - code: string
                        label: string
                      code: string
                      consumption:
                        type: VOUCHER
                      custom_attributes:
                      - code: string
                        label: string
                        order_configuration:
                          maximum_number_of_elements: 0
