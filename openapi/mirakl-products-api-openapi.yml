  /api/products:
    get:
      description: '<div class="extension-title">Description</div>


        Note: this resource returns 100 products maximum <br/> Results are sorted by product sku asc, then by product identifier type asc and then by product identifier asc


        <div class="api-description-extension">

        <div class="extension-title">Call Frequency</div>


        <div class="recommended-call-frequency">Recommended usage: At each product page display</div>

        <div class="max-call-frequency">Maximum usage: At each product page display</div>

        <div class="extension-title">Localization</div>


        <p>This resource supports <code>locale</code> parameter (<a href="#section/Locale">see documentation</a>)</p><p>Localized output fields will be highlighted with an icon: <span class="flag"></span></p></div>'
      operationId: P31
      parameters:
      - description: 'List of the product''s identifiers with type, _(structure: "`product_references=<productIdType>|<productId>,<productIdType>|<productId>, ...`")_

          where accepted `<productIdType>` are operator’s product references, like `EAN` or `UPC` for example.


          Note that `SHOP_SKU` or `SKU` are invalid `<productIdType>` for this API.

          '
        explode: true
        in: query
        name: product_references
        required: true
        schema:
          type: string
        style: form
      - deprecated: true
        description: 'List of the product''s identifiers with type, _(structure: "`products=<productId>|<productIdType>,<productId>|<productIdType>, ...`")_

          where accepted `<productIdType>` are operator’s product references, like `EAN` or `UPC` for example.


          Note that `SHOP_SKU` or `SKU` are invalid `<productIdType>` for this API.

          '
        explode: true
        in: query
        name: products
        required: false
        schema:
          type: string
          deprecated: true
        style: form
      responses:
        '200':
          content:
            application/json:
              examples:
                application/json-0:
                  summary: Example with business values (application/json)
                  value:
                    products:
                    - authorized_shop_ids: []
                      category_code: '5110114'
                      category_label: Coffee Machines
                      product_id: '9312432012041'
                      product_id_type: EAN
                      product_sku: MKP100000000037254
                      product_title: Breville Cafe Roma Stainless Espresso/Cappuccino Machine - ESP8C
                application/json-auto:
                  summary: Complete example with value types (application/json)
                  value:
                    products:
                    - authorized_shop_ids:
                      - string
                      category_code: string
                      category_label: string
                      product_id: string
                      product_id_type: string
                      product_sku: string
                      product_title: string
                    total_count: 0
              schema:
                type: object
                $ref: '#/components/schemas/P31_Response_200'
          description: OK
      security:
      - Operator-Bearer-Token: []
      - OAuth-2: []
      summary: P31 - Get products for a list of product references
      tags:
      - Products
