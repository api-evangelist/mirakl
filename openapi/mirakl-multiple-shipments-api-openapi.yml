                      package_reference: package_ref_1
                      quantity: 1
                    - order_line_id: ORDER_01-A-2
                      package_reference: package_ref_2
                      quantity: 3
                    shipped: true
                    tracking:
                      carrier_name: Custom carrier
                      tracking_url: http://www.customcarrier.com/tracking
