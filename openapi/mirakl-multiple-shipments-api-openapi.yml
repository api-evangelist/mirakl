          description: State
        street_1:
          type: string
          description: First information line of the address street
        street_2:
          type: string
          description: Second information line of the address street
        zip_code:
          type: string
          description: Address zip code
    ST24_Response_200_ShipmentSuccess:
      type: object
      properties:
        id:
          type: string
