openapi: 3.2.0
info:
  title: Mirakl Multiple shipments API
  version: ''
  description: 'Operations tagged Multiple shipments across 3 of this provider''s published API definitions: mirakl-mmp-front-openapi.yaml, mirakl-mmp-operator-openapi.json, mirakl-mmp-seller-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- description: URL to be replaced by your Mirakl instance URL
  url: https://your-instance.mirakl.net
tags:
- name: Multiple shipments
paths:
  /api/shipments:
    post:
