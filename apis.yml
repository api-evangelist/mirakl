aid: mirakl
name: Mirakl
description: >-
  Mirakl is the global leader in platform business innovation, providing an operating
  system for commerce that lets retailers, brands, and B2B distributors launch and
  scale online marketplaces and dropship programs without holding inventory. The
  platform spans the Mirakl Marketplace Platform (MMP), Mirakl Platform for Services
  (MPS), the Mirakl Catalog Platform, Mirakl Connect for multichannel selling, Mirakl
  Ads retail media, and Mirakl Payout. Mirakl exposes extensive REST APIs (OpenAPI
  3.1) for sellers/shops and operators covering orders, offers, products, catalog,
  invoicing, messaging, returns, and shipments, plus a Connect Channel Platform with
  push webhooks for offer, price/stock, product, order-action, and store events.
